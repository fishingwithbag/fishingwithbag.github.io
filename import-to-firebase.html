btn.addEventListener('click', async ()=>{
  btn.disabled=true;
  btn.textContent='匯入中…';
  addLog(`開始匯入 ${PLACES.length} 筆資料…`,'info');

  // 先檢查是否已有資料
  try{
    const snap=await get(ref(db,'base_places'));
    if(snap.exists()){
      const existing=Object.keys(snap.val()).length;
      addLog(`⚠️ Firebase 已有 ${existing} 筆資料，將覆蓋更新…`,'err');
    }
  }catch(e){}

  let ok=0,fail=0;
  for(const p of PLACES){
    try{
      await set(ref(db,`base_places/${p.id}`), p);
      addLog(`✅ [${String(p.id).padStart(2,'0')}] ${p.name}`,'ok');
      ok++;
    }catch(e){
      addLog(`❌ [${p.id}] ${p.name} — ${e.message}`,'err');
      fail++;
    }
  }
  addLog(`──────────────────`,'info');
  addLog(`完成！成功 ${ok} 筆 / 失敗 ${fail} 筆`,'info');
  if(fail===0){
    addLog('🎉 所有資料已成功寫入 Firebase！','ok');
    addLog('現在可以關閉這個頁面，index.html 會自動從 Firebase 讀取資料。','info');
  }
  btn.textContent='匯入完成';
});
</script>
