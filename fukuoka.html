<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>福岡 — 九州旅遊紀錄 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    :root { --c-page: var(--c-fukuoka); --c-page-l: var(--c-fukuoka-l); }

    .page-hero {
      position: relative; overflow: hidden;
      padding: calc(var(--safe-top) + 3rem) 1.25rem 2rem;
      background: linear-gradient(160deg,#1A0A05,#2D1810 60%,#1A1A2E);
      min-height: 220px;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .page-hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 60% 80%, rgba(232,115,74,0.35), transparent 65%);
      pointer-events: none;
    }
    .page-hero__back {
      position: absolute; top: calc(var(--safe-top) + 0.75rem); left: 1rem;
      display: flex; align-items: center; gap: 0.3rem;
      font-size: 0.75rem; letter-spacing: 0.1em; opacity: 0.6;
      min-height: 44px; padding: 0 0.5rem;
      -webkit-tap-highlight-color: transparent;
    }
    .page-hero__content { position: relative; z-index: 2; }
    .page-hero__tag {
      font-size: 0.62rem; letter-spacing: 0.28em;
      text-transform: uppercase; opacity: 0.55; margin-bottom: 0.4rem;
    }
    .page-hero__title {
      font-family: var(--f-serif);
      font-size: clamp(2.8rem, 12vw, 5rem);
      font-weight: 700; line-height: 1;
      color: var(--c-page-l);
    }
    .page-hero__sub {
      font-size: 0.78rem; opacity: 0.5; margin-top: 0.5rem;
      line-height: 1.7; max-width: 36ch;
    }

    .stats-strip {
      display: grid; grid-template-columns: repeat(2, 1fr);
    }
    .stats-strip__item {
      padding: 1rem;
      border-right: 1px solid var(--c-border);
      border-bottom: 1px solid var(--c-border);
    }
    .stats-strip__item:nth-child(2n) { border-right: none; }
    .stats-strip__item:nth-last-child(-n+2) { border-bottom: none; }
    .stats-strip__num {
      font-family: var(--f-serif);
      font-size: 1.6rem; font-weight: 700;
      color: var(--c-page); display: block; line-height: 1;
    }
    .stats-strip__label {
      font-size: 0.65rem; letter-spacing: 0.12em;
      opacity: 0.45; margin-top: 0.25rem; display: block;
    }

    .content-wrap {
      padding: 0 1rem 2rem;
    }

    @media (min-width: 640px) {
      .stats-strip { grid-template-columns: repeat(4, 1fr); }
      .stats-strip__item { border-bottom: none; }
      .stats-strip__item:nth-child(2n) { border-right: 1px solid var(--c-border); }
      .stats-strip__item:last-child { border-right: none; }
      .page-hero { padding: calc(var(--safe-top) + 4rem) 2rem 2.5rem; }
      .content-wrap { padding: 0 1.5rem 2rem; }
    }

    @media (min-width: 1024px) {
      .page-hero { padding: 6rem 3rem 3rem; min-height: 320px; }
      .content-wrap { padding: 0 2rem 3rem; }
    }
  </style>
</head>
<body>

  <!-- Top Nav（桌機） -->
  <nav class="top-nav">
    <a href="index.html" class="top-nav__logo">九州 · 2026 秋</a>
    <ul class="top-nav__links">
      <li><a href="kumamoto.html">熊本</a></li>
      <li><a href="fukuoka.html" class="active">福岡</a></li>
      <li><a href="oita.html">大分</a></li>
    </ul>
  </nav>

  <!-- Page Hero -->
  <header class="page-hero">
    <a href="index.html" class="page-hero__back">← 返回</a>
    <div class="page-hero__content">
      <p class="page-hero__tag">Fukuoka · 美食 × 都市 × 夜生活</p>
      <h1 class="page-hero__title">福岡</h1>
      <p class="page-hero__sub">拉麵、燒肉、居酒屋、市場 — 博多巷弄裡的每一個驚喜。</p>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-strip">
    <div class="stats-strip__item">
      <span class="stats-strip__num" id="s-total">0</span>
      <span class="stats-strip__label">筆紀錄</span>
    </div>
    <div class="stats-strip__item">
      <span class="stats-strip__num" id="s-food">0</span>
      <span class="stats-strip__label">餐廳</span>
    </div>
    <div class="stats-strip__item">
      <span class="stats-strip__num" id="s-spot">0</span>
      <span class="stats-strip__label">景點</span>
    </div>
    <div class="stats-strip__item">
      <span class="stats-strip__num" id="s-stay">0</span>
      <span class="stats-strip__label">住宿</span>
    </div>
  </div>

  <!-- Content -->
  <main class="content-wrap">
    <div class="section-heading">
      <h2>所有地點</h2>
      <span id="result-count">— 筆</span>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
    <div class="card-grid" id="card-grid"></div>
  </main>

  <!-- Bottom Nav（手機） -->
  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav__item">
      <span>🏠</span><span>首頁</span>
    </a>
    <a href="kumamoto.html" class="bottom-nav__item">
      <span>⛰️</span><span>熊本</span>
    </a>
    <a href="fukuoka.html" class="bottom-nav__item active">
      <span>🌆</span><span>福岡</span>
    </a>
    <a href="oita.html" class="bottom-nav__item">
      <span>⚔️</span><span>大分</span>
    </a>
  </nav>

  <script type="module">
    const ICON = { '景點':'🗺️','餐廳':'🍜','住宿':'🏨','購物':'🛍️' };
    const FISHING = ['釣魚','路亞','釣具','磯釣'];

    function animCount(el, end) {
      const s = performance.now();
      const tick = n => {
        const p = Math.min((n - s) / 800, 1);
        el.textContent = Math.round((1 - Math.pow(1-p, 3)) * end);
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    const revObs = new IntersectionObserver(entries => {
      entries.forEach(({ isIntersecting, target }, i) => {
        if (!isIntersecting) return;
        setTimeout(() => target.classList.add('visible'), i * 35);
        revObs.unobserve(target);
      });
    }, { threshold: 0.04, rootMargin: '0px 0px -10px 0px' });

    function buildCard(p) {
      const img = p.photo
        ? `<img src="${p.photo}" alt="${p.name}" loading="lazy">`
        : `<span class="card__placeholder">${ICON[p.category]??'📍'}</span>`;
      const tags = p.tags.map(t =>
        `<span class="tag${FISHING.some(k=>t.includes(k))?' tag--fishing':''}">${t}</span>`
      ).join('');
      const el = document.createElement('article');
      el.className = 'card';
      el.innerHTML = `
        <div class="card__img">${img}</div>
        <div class="card__body">
          <div class="card__meta">
            <span class="card__sub">${p.subcategory}</span>
            <span class="card__cat-badge">${p.category}</span>
          </div>
          <h3 class="card__name">${p.name}</h3>
          <p class="card__note">${p.note}</p>
          <div class="card__tags">${tags}</div>
        </div>`;
      return el;
    }

    function renderGrid(places) {
      const grid = document.getElementById('card-grid');
      document.getElementById('result-count').textContent = `${places.length} 筆`;
      grid.innerHTML = '';
      if (!places.length) {
        grid.innerHTML = '<p class="empty">此分類暫無資料</p>'; return;
      }
      places.forEach(p => { const c = buildCard(p); grid.appendChild(c); revObs.observe(c); });
    }

    function buildFilters(places) {
      const bar = document.getElementById('filter-bar');
      const cats = ['全部', ...new Set(places.map(p => p.category))];
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `filter-btn${cat==='全部'?' active':''}`;
        btn.textContent = cat === '全部' ? `全部 ${places.length}` : `${ICON[cat]??''} ${cat}`;
        btn.dataset.cat = cat;
        bar.appendChild(btn);
      });
      bar.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.cat;
        renderGrid(cat === '全部' ? places : places.filter(p => p.category === cat));
      });
    }

    const res = await fetch('./data/trips.json');
    const { places: all } = await res.json();
    const places = all.filter(p => p.region === '福岡');

    animCount(document.getElementById('s-total'), places.length);
    animCount(document.getElementById('s-food'),  places.filter(p=>p.category==='餐廳').length);
    animCount(document.getElementById('s-spot'),  places.filter(p=>p.category==='景點').length);
    animCount(document.getElementById('s-stay'),  places.filter(p=>p.category==='住宿').length);

    buildFilters(places);
    renderGrid(places);
  </script>

</body>
</html>
