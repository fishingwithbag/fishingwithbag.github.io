<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>大分／別府 — 九州旅遊 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#0D0D0D; --surface:#141414; --surface2:#1C1C1C;
      --border:rgba(255,255,255,0.09); --text:#E8E8E8;
      --muted:rgba(232,232,232,0.48);
      --accent:#B8AFFF; --accent-d:#4A3F8F;
      --serif:'Noto Serif JP',serif; --sans:'Noto Sans TC',sans-serif;
      --ease:cubic-bezier(.4,0,.2,1); --r:10px;
      --safe-t:env(safe-area-inset-top,0px);
      --safe-b:env(safe-area-inset-bottom,0px);
    }
    html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
    body {
      font-family:var(--sans); background:var(--bg); color:var(--text);
      overflow-x:hidden; padding-bottom:calc(60px + var(--safe-b));
    }
    a { color:inherit; text-decoration:none; }
    button { font-family:inherit; cursor:pointer; border:none; background:none; }

    .page-hero {
      position:relative; overflow:hidden;
      background:linear-gradient(155deg,#0D0D1F,#1A1535 60%,#0D0D1A);
      padding:calc(var(--safe-t) + 3.5rem) 1.25rem 2rem;
      min-height:200px; display:flex; flex-direction:column; justify-content:flex-end;
    }
    .page-hero::before {
      content:''; position:absolute; inset:0;
      background:radial-gradient(ellipse at 70% 85%,rgba(123,104,238,.5),transparent 65%);
    }
    .page-hero__back {
      position:absolute; top:calc(var(--safe-t) + .6rem); left:1rem;
      display:flex; align-items:center; gap:.3rem;
      font-size:.75rem; opacity:.55; min-height:44px; padding:0 .4rem;
      -webkit-tap-highlight-color:transparent;
    }
    .page-hero__content { position:relative; z-index:2; }
    .page-hero__tag { font-size:.6rem; letter-spacing:.28em; text-transform:uppercase; opacity:.5; margin-bottom:.35rem; display:block; }
    .page-hero__title { font-family:var(--serif); font-size:clamp(2.8rem,12vw,5rem); font-weight:700; line-height:1; color:var(--accent); }
    .page-hero__sub { font-size:.76rem; opacity:.48; margin-top:.5rem; line-height:1.7; }

    /* Region tab switch */
    .region-tabs {
      display:flex; border-bottom:1px solid var(--border);
    }
    .region-tab {
      flex:1; padding:.75rem .5rem; font-size:.78rem; letter-spacing:.1em;
      text-align:center; opacity:.4; border-bottom:2px solid transparent;
      transition:opacity .2s,border-color .2s; cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .region-tab.active { opacity:1; border-bottom-color:var(--accent); }

    .stats-strip { display:grid; grid-template-columns:repeat(2,1fr); }
    .stats-strip__item { padding:1rem; border-right:1px solid var(--border); border-bottom:1px solid var(--border); }
    .stats-strip__item:nth-child(2n) { border-right:none; }
    .stats-strip__item:nth-last-child(-n+2) { border-bottom:none; }
    .stats-strip__num { font-family:var(--serif); font-size:1.6rem; font-weight:700; color:var(--accent); display:block; line-height:1; }
    .stats-strip__label { font-size:.63rem; letter-spacing:.12em; opacity:.4; margin-top:.25rem; display:block; }

    .filter-bar {
      display:flex; gap:.4rem; overflow-x:auto;
      scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; padding:.75rem 1rem .5rem;
    }
    .filter-bar::-webkit-scrollbar { display:none; }
    .filter-btn {
      flex-shrink:0; scroll-snap-align:start;
      padding:.38rem .9rem; border-radius:20px;
      border:1px solid var(--border); font-size:.75rem;
      white-space:nowrap; color:var(--text); background:transparent;
      min-height:36px; transition:background .2s,border-color .2s,color .2s;
      -webkit-tap-highlight-color:transparent;
    }
    .filter-btn.active { background:var(--accent); border-color:var(--accent); color:#0D0D1A; }

    .section-heading { display:flex; align-items:baseline; gap:.6rem; padding:.5rem 1rem .75rem; }
    .section-heading h2 { font-family:var(--serif); font-size:1.1rem; font-weight:700; }
    .section-heading span { font-size:.65rem; letter-spacing:.15em; opacity:.35; }

    .card-grid { display:grid; grid-template-columns:1fr; gap:.75rem; padding:0 1rem 1rem; }

    .card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r); overflow:hidden;
      opacity:0; transform:translateY(14px);
      transition:opacity .4s var(--ease),transform .4s var(--ease);
    }
    .card.visible { opacity:1; transform:none; }
    .card__top { display:flex; align-items:flex-start; justify-content:space-between; padding:.9rem 1rem .5rem; gap:.5rem; }
    .card__left { flex:1; min-width:0; }
    .card__meta { display:flex; align-items:center; gap:.4rem; margin-bottom:.3rem; flex-wrap:wrap; }
    .card__region-badge { font-size:.62rem; padding:.12rem .48rem; border-radius:20px; border:1px solid var(--border); opacity:.6; }
    .card__sub { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; opacity:.38; }
    .card__name { font-family:var(--serif); font-size:.97rem; font-weight:700; line-height:1.4; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .card__actions { display:flex; flex-direction:column; gap:.4rem; align-items:flex-end; flex-shrink:0; }
    .fav-btn { font-size:1.2rem; min-width:36px; min-height:36px; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
    .maps-btn { font-size:.63rem; letter-spacing:.08em; padding:.28rem .65rem; border:1px solid var(--border); border-radius:20px; white-space:nowrap; opacity:.6; -webkit-tap-highlight-color:transparent; }
    .maps-btn:active { opacity:1; border-color:var(--accent); }
    .card__note-wrap { padding:0 1rem .9rem; }
    .card__note-toggle { display:none; font-size:.73rem; color:var(--accent); opacity:.75; -webkit-tap-highlight-color:transparent; }
    .card.has-note .card__note-toggle { display:inline-block; }
    .card__note { font-size:.79rem; line-height:1.75; color:var(--muted); margin-top:.4rem; display:none; }
    .card.note-open .card__note { display:block; }
    .card__tags { display:flex; flex-wrap:wrap; gap:.3rem; padding:0 1rem .75rem; }
    .tag { font-size:.63rem; letter-spacing:.05em; padding:.18rem .55rem; border:1px solid rgba(255,255,255,.1); border-radius:20px; opacity:.5; }

    .empty { grid-column:1/-1; text-align:center; padding:3rem 1rem; opacity:.3; font-size:.85rem; letter-spacing:.15em; }

    .bottom-nav {
      position:fixed; bottom:0; left:0; right:0; z-index:100;
      display:flex; background:rgba(13,13,13,.97);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      border-top:1px solid var(--border); padding-bottom:var(--safe-b);
    }
    .bottom-nav__item {
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:3px; padding:.6rem 0; min-height:44px; opacity:.4; transition:opacity .2s;
      text-decoration:none; color:var(--text); -webkit-tap-highlight-color:transparent;
    }
    .bottom-nav__item.active { opacity:1; }
    .bottom-nav__item span:first-child { font-size:1.15rem; line-height:1; }
    .bottom-nav__item span:last-child { font-size:.58rem; letter-spacing:.08em; }

    @media (min-width:600px) {
      .card-grid { grid-template-columns:repeat(2,1fr); }
      .stats-strip { grid-template-columns:repeat(4,1fr); }
      .stats-strip__item { border-bottom:none; }
      .stats-strip__item:nth-child(2n) { border-right:1px solid var(--border); }
      .stats-strip__item:last-child { border-right:none; }
    }
    @media (min-width:960px) {
      .card-grid { grid-template-columns:repeat(3,1fr); }
      .bottom-nav { display:none; }
      body { padding-bottom:0; }
      .page-hero { padding:6rem 3rem 3rem; min-height:300px; }
      .card-grid { padding:0 2rem 2rem; }
      .filter-bar { padding:.75rem 2rem .5rem; }
      .section-heading { padding:.5rem 2rem .75rem; }
    }
  </style>
</head>
<body>

<header class="page-hero">
  <a href="travel.html" class="page-hero__back">← 返回</a>
  <div class="page-hero__content">
    <span class="page-hero__tag">Ōita · Beppu · 10/1 – 10/2 · 動漫 × 溫泉 × 動物</span>
    <h1 class="page-hero__title">大分／別府</h1>
    <p class="page-hero__sub">進擊の巨人、African Safari、由布院溫泉 — 大分最強打卡行程。</p>
  </div>
</header>

<!-- Region tabs：大分 / 別府 -->
<div class="region-tabs" id="region-tabs">
  <button class="region-tab active" data-r="全部">全部</button>
  <button class="region-tab" data-r="大分">⚔️ 大分</button>
  <button class="region-tab" data-r="別府">♨️ 別府</button>
</div>

<div class="stats-strip">
  <div class="stats-strip__item"><span class="stats-strip__num" id="s-total">—</span><span class="stats-strip__label">筆紀錄</span></div>
  <div class="stats-strip__item"><span class="stats-strip__num" id="s-spot">—</span><span class="stats-strip__label">景點</span></div>
  <div class="stats-strip__item"><span class="stats-strip__num" id="s-food">—</span><span class="stats-strip__label">餐廳</span></div>
  <div class="stats-strip__item"><span class="stats-strip__num" id="s-stay">—</span><span class="stats-strip__label">住宿</span></div>
</div>

<div class="filter-bar" id="filter-bar"></div>

<div class="section-heading">
  <h2>所有地點</h2>
  <span id="result-count"></span>
</div>

<div class="card-grid" id="card-grid"></div>

<nav class="bottom-nav">
  <a href="travel.html" class="bottom-nav__item"><span>🏠</span><span>首頁</span></a>
  <a href="kumamoto.html" class="bottom-nav__item"><span>⛰️</span><span>熊本</span></a>
  <a href="fukuoka.html" class="bottom-nav__item"><span>🌆</span><span>福岡</span></a>
  <a href="oita.html" class="bottom-nav__item active"><span>⚔️</span><span>大分</span></a>
</nav>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const REGIONS = ['大分','別府'];
const firebaseConfig={
  apiKey:"AIzaSyApX90ynhEGP2uBgxMXOhNeM-Jbrvyzgps",
  authDomain:"gen-lang-client-0162948406.firebaseapp.com",
  databaseURL:"https://gen-lang-client-0162948406-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"gen-lang-client-0162948406",
  storageBucket:"gen-lang-client-0162948406.firebasestorage.app",
  messagingSenderId:"700325287638",
  appId:"1:700325287638:web:541c2146fd62adcb789b77"
};
const db=getDatabase(initializeApp(firebaseConfig));
let allPlaces = [];
let basePlaces = [];
let customPlaces = [];
let activeRegion = '全部';
let activeCat = '全部';

function animN(el, end) {
  const s = performance.now();
  const t = n=>{const p=Math.min((n-s)/800,1);el.textContent=Math.round((1-Math.pow(1-p,3))*end);if(p<1)requestAnimationFrame(t);};
  requestAnimationFrame(t);
}

const revObs = new IntersectionObserver(entries=>{
  entries.forEach(({isIntersecting,target},i)=>{
    if(!isIntersecting)return;
    setTimeout(()=>target.classList.add('visible'),i*35);
    revObs.unobserve(target);
  });
},{threshold:.04,rootMargin:'0px 0px -8px 0px'});

function getFavs(){ return (JSON.parse(localStorage.getItem('kyushu_favs')||'[]')||[]).map(String); }
function setFav(id){
  id=String(id);
  const saved=getFavs(); const idx=saved.indexOf(id);
  idx>-1?saved.splice(idx,1):saved.push(id);
  localStorage.setItem('kyushu_favs',JSON.stringify(saved));
  return idx>-1?'☆':'⭐';
}

function buildCard(p) {
  const el=document.createElement('article');
  el.className='card'; el.dataset.id=p.id;
  const q=encodeURIComponent(p.name+' '+p.region+' Japan');
  const tags=(p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');
  const fav=getFavs().includes(String(p.id));
  el.innerHTML=`
    <div class="card__top">
      <div class="card__left">
        <div class="card__meta">
          <span class="card__region-badge">${p.region==='別府'?'♨️':'⚔️'} ${p.region}</span>
          <span class="card__sub">${p.subcategory}</span>
        </div>
        <div class="card__name">${p.name}</div>
      </div>
      <div class="card__actions">
        <button class="fav-btn" data-fav="${p.id}">${fav?'⭐':'☆'}</button>
        <a class="maps-btn" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">🗺 Maps</a>
      </div>
    </div>
    <div class="card__note-wrap">
      <button class="card__note-toggle">▸ 展開備註</button>
      <p class="card__note">${p.note}</p>
    </div>
    <div class="card__tags">${tags}</div>`;
  if(p.note) el.classList.add('has-note');
  return el;
}

function getFiltered() {
  return allPlaces.filter(p=>{
    if(activeRegion!=='全部' && p.region!==activeRegion) return false;
    if(activeCat!=='全部' && p.category!==activeCat) return false;
    return true;
  });
}

function updateStats(places) {
  document.getElementById('s-total').textContent=places.length;
  document.getElementById('s-spot').textContent=places.filter(p=>p.category==='景點').length;
  document.getElementById('s-food').textContent=places.filter(p=>p.category==='餐廳').length;
  document.getElementById('s-stay').textContent=places.filter(p=>p.category==='住宿').length;
}

function render() {
  const places=getFiltered();
  document.getElementById('result-count').textContent=`${places.length} 筆`;
  const grid=document.getElementById('card-grid');
  grid.innerHTML='';
  if(!places.length){grid.innerHTML='<p class="empty">此分類暫無資料</p>';return;}
  places.forEach(p=>{const c=buildCard(p);grid.appendChild(c);revObs.observe(c);});
  grid.onclick=e=>{
    const fav=e.target.closest('[data-fav]');
    if(fav){fav.textContent=setFav(fav.dataset.fav);return;}
    const tog=e.target.closest('.card__note-toggle')||e.target.closest('.card__name');
    if(tog){
      const card=tog.closest('.card');
      const open=card.classList.toggle('note-open');
      const t=card.querySelector('.card__note-toggle');
      if(t)t.textContent=open?'▾ 收合備註':'▸ 展開備註';
    }
  };
}

function buildFilters() {
  const bar=document.getElementById('filter-bar');
  bar.innerHTML='';
  const cats=['全部',...new Set(allPlaces.map(p=>p.category))];
  if(!cats.includes(activeCat)) activeCat='全部';
  cats.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className=`filter-btn${cat===activeCat?' active':''}`;
    btn.textContent=cat; btn.dataset.cat=cat; bar.appendChild(btn);
  });
  bar.onclick=e=>{
    const btn=e.target.closest('.filter-btn');if(!btn)return;
    bar.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); activeCat=btn.dataset.cat; render();
  };
}

// Region tabs
document.getElementById('region-tabs').addEventListener('click',e=>{
  const tab=e.target.closest('.region-tab');if(!tab)return;
  document.querySelectorAll('.region-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active'); activeRegion=tab.dataset.r; activeCat='全部';
  buildFilters(); render();
  updateStats(getFiltered());
});

function paint(){
  allPlaces=[...basePlaces,...customPlaces].filter(p=>REGIONS.includes(p.region));
  updateStats(getFiltered());
  buildFilters();
  render();
}

onValue(ref(db,'base_places'),snap=>{basePlaces=snap.val()?Object.values(snap.val()):[];paint();});
onValue(ref(db,'custom_places'),snap=>{customPlaces=snap.val()?Object.values(snap.val()):[];paint();});
</script>
</body>
</html>
