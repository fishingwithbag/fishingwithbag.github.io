<!DOCTYPE html>

<html data-theme="dark" lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="default" name="apple-mobile-web-app-status-bar-style"/>
<meta content="九州自駕" name="apple-mobile-web-app-title"/>
<meta content="#FFFEEE" name="theme-color"/>
<title>每日行程表 - 九州福岡熊本旅遊 </title>
<link href="icons/apple-touch-icon.png?v=20260915" rel="apple-touch-icon" sizes="180x180"/>
<link href="icons/favicon-32.png?v=20260915" rel="icon" sizes="32x32" type="image/png"/>
<link href="manifest.webmanifest?v=20260915" rel="manifest"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&amp;family=Noto+Sans+TC:wght@300;400&amp;display=swap" rel="stylesheet"/>
<style>
    :root {
      --bg:#0D0D0D; --surface:#141414; --surface2:#1C1C1C;
      --border:rgba(255,255,255,0.09); --text:#E8E8E8; --muted:rgba(232,232,232,0.48);
      --accent:#E8734A; --accent2:#A8C5B0;
      --serif:'Noto Serif JP',serif; --sans:'Noto Sans TC',sans-serif;
      --r:10px; --ease:cubic-bezier(.4,0,.2,1);
      --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    }
    [data-theme="light"] {
      --bg:#F5F2EE; --surface:#FFF; --surface2:#F0EDE9;
      --border:rgba(0,0,0,0.1); --text:#1A1A1A; --muted:rgba(26,26,26,0.55);
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { -webkit-text-size-adjust:100%; }
    body { font-family:var(--sans); background:var(--bg); color:var(--text); overflow-x:hidden; padding-bottom:calc(64px + var(--safe-b)); transition:background .3s, color .3s; }
    a { color:inherit; text-decoration:none; }
    button { font-family:inherit; cursor:pointer; border:none; background:none; }
    input, select, textarea { font-family:inherit; }

    /* Topbar */
    .topbar { position:sticky; top:0; z-index:200; background:rgba(13,13,13,.95); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid var(--border); padding:0 1rem; padding-top:var(--safe-t); display:flex; align-items:center; justify-content:space-between; min-height:52px; gap:.5rem; }
    [data-theme="light"] .topbar { background:rgba(245,242,238,.95); }
    .topbar__left { display:flex; align-items:center; gap:.6rem; }
    .topbar__back { font-size:.8rem; opacity:.55; padding:.4rem; min-height:44px; display:flex; align-items:center; -webkit-tap-highlight-color:transparent; }
    .topbar__title { font-family:var(--serif); font-size:.9rem; letter-spacing:.15em; }
    .icon-btn { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; border:1px solid var(--border); background:var(--surface); color:var(--text); -webkit-tap-highlight-color:transparent; }

    /* Collaboration */
    .collab-bar { display:flex; align-items:center; justify-content:space-between; gap:.65rem; padding:.45rem 1rem; border-bottom:1px solid var(--border); background:var(--surface2); }
    .collab-identity { display:flex; align-items:center; gap:.4rem; white-space:nowrap; color:var(--muted); font-size:.68rem; }
    .collab-select { min-height:34px; padding:.3rem 1.6rem .3rem .55rem; border:1px solid var(--border); border-radius:18px; background:var(--surface); color:var(--text); font-size:.7rem; outline:none; }
    .collab-select option { color:#1a1a1a; background:#fff; }
    .online-users { display:flex; align-items:center; justify-content:flex-end; gap:.3rem; min-width:0; overflow-x:auto; scrollbar-width:none; }
    .online-users::-webkit-scrollbar { display:none; }
    .online-label { flex:0 0 auto; color:var(--muted); font-size:.62rem; }
    .online-chip { flex:0 0 auto; padding:.18rem .45rem; border:1px solid rgba(66,180,110,.38); border-radius:14px; color:#63d58e; background:rgba(66,180,110,.08); font-size:.62rem; }

    /* Date tabs */
    .date-tabs { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; border-bottom:1px solid var(--border); background:var(--surface); }
    .date-tabs::-webkit-scrollbar { display:none; }
    .date-tab { flex:0 0 auto; scroll-snap-align:start; padding:.75rem 1.1rem; font-size:.78rem; letter-spacing:.08em; white-space:nowrap; opacity:.45; border-bottom:2px solid transparent; transition:opacity .2s, border-color .2s, color .2s; -webkit-tap-highlight-color:transparent; cursor:pointer; min-height:44px; display:flex; flex-direction:column; align-items:center; gap:2px; }
    .date-tab__day { font-family:var(--serif); font-size:1.1rem; font-weight:700; line-height:1; }
    .date-tab__label { font-size:.6rem; letter-spacing:.1em; }
    .date-tab.active { opacity:1; border-bottom-color:var(--accent); color:var(--accent); }
    /* 深色模式：非 active tab 文字提升可讀性 */
    [data-theme="dark"] .date-tab {color: rgba(232, 232, 232, 0.75);}
    [data-theme="dark"] .date-tab.active {color: var(--accent);opacity: 1;}
    /* 淺色模式：非 active tab 文字改用深色 */
    [data-theme="light"] .date-tab {color: rgba(26, 26, 26, 0.65);}
    [data-theme="light"] .date-tab.active {color: var(--accent);opacity: 1;}

    /* Region picker */
    .region-picker { padding:.55rem 1rem; border-bottom:1px solid var(--border); background:var(--surface2); }
    .region-picker__label { font-size:.7rem; opacity:.45; white-space:nowrap; letter-spacing:.08em; }
    .region-picker__trigger { width:100%; min-height:44px; display:flex; align-items:center; gap:.55rem; padding:.45rem .7rem; border:1px solid var(--border); border-radius:8px; color:var(--text); background:var(--surface); text-align:left; }
    .region-picker__chips { display:flex; flex:1; gap:.35rem; flex-wrap:wrap; }
    .region-chip { padding:.18rem .5rem; border:1px solid rgba(232,115,74,.38); border-radius:20px; color:var(--accent); background:rgba(232,115,74,.1); font-size:.68rem; }
    .region-picker__menu { display:none; grid-template-columns:repeat(3,1fr); gap:.4rem; margin-top:.45rem; }
    .region-picker__menu.open { display:grid; }
    .region-option { min-height:40px; padding:.4rem; border:1px solid var(--border); border-radius:7px; color:var(--text); background:var(--surface); font-size:.72rem; }
    .region-option.active { border-color:var(--accent); color:var(--accent); background:rgba(232,115,74,.1); }

    /* Two-car view */
    .group-view { display:flex; gap:.4rem; padding:.5rem 1rem; overflow-x:auto; border-bottom:1px solid var(--border); scrollbar-width:none; }
    .group-view::-webkit-scrollbar { display:none; }
    .group-view__btn { flex:0 0 auto; min-height:36px; padding:.35rem .72rem; border:1px solid var(--border); border-radius:18px; color:var(--muted); background:var(--surface); font-size:.68rem; }
    .group-view__btn.active { border-color:var(--accent); color:#fff; background:var(--accent); }
    .group-badge--all { color:var(--accent2); border-color:rgba(168,197,176,.45); opacity:1; }
    .group-badge--carA { color:#72a7ff; border-color:rgba(114,167,255,.5); opacity:1; }
    .group-badge--carB { color:#d2a8ff; border-color:rgba(210,168,255,.5); opacity:1; }
    .tl-card__updated { margin-top:.3rem; color:var(--muted); font-size:.6rem; line-height:1.45; }
    .tl-card__lock { color:#ffbf69; }
    .tl-card__warning { margin-top:.35rem; padding:.38rem .5rem; border:1px solid rgba(255,107,107,.35); border-radius:6px; color:#ff9b9b; background:rgba(255,107,107,.08); font-size:.66rem; line-height:1.55; }
    .btn-edit:disabled,.btn-del:disabled { cursor:not-allowed; opacity:.25; pointer-events:none; }

    /* Day summary */
    .day-summary { display:flex; gap:.5rem; padding:.65rem 1rem; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border); }
    .day-summary::-webkit-scrollbar { display:none; }
    .summary-pill { flex:0 0 auto; font-size:.68rem; padding:.28rem .7rem; border-radius:20px; border:1px solid var(--border); background:var(--surface2); white-space:nowrap; }

    /* Timeline */
    .timeline { padding:.75rem 1rem 1rem; display:flex; flex-direction:column; gap:0; }
    .tl-item { display:grid; grid-template-columns:56px 1fr; gap:0; position:relative; }
    .tl-item::before { content:''; position:absolute; left:27px; top:32px; bottom:-8px; width:2px; background:var(--border); z-index:0; }
    .tl-item:last-child::before { display:none; }
    .tl-time { padding-top:6px; text-align:right; padding-right:12px; }
    .tl-time__h { font-family:var(--serif); font-size:.88rem; font-weight:700; color:var(--accent); line-height:1; }
    .tl-time__m { font-size:.62rem; opacity:.45; }
    .tl-dot { position:absolute; left:22px; top:8px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); z-index:1; }
    .tl-dot--transit { background:var(--border); }
    .tl-dot--meal { background:#FFD700; }
    .tl-dot--stay { background:var(--accent2); }
    .tl-card { margin-left:20px; margin-bottom:8px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; transition:border-color .2s; }
    .tl-card:active { border-color:var(--accent); }
    .tl-card--transit { background:transparent; border:none; padding:.3rem 0 .3rem .75rem; }
    .tl-card--transit .tl-transit-label { font-size:.72rem; color:var(--muted); display:flex; align-items:center; gap:.4rem; }
    .tl-card__main { padding:.7rem .85rem .5rem; }
    .tl-card__meta { display:flex; align-items:center; gap:.35rem; margin-bottom:.25rem; flex-wrap:wrap; }
    .tl-card__cat { font-size:.6rem; padding:.1rem .42rem; border-radius:20px; border:1px solid var(--border); opacity:.55; }
    .tl-card__dur { font-size:.6rem; opacity:.4; letter-spacing:.06em; }
    .tl-card__name { font-family:var(--serif); font-size:.95rem; font-weight:700; line-height:1.4; }
    .tl-card__hours { font-size:.72rem; color:var(--accent2); margin-top:.2rem; }
    .tl-card__note { font-size:.75rem; color:var(--muted); margin-top:.3rem; line-height:1.65; display:none; }
    .tl-card.note-open .tl-card__note { display:block; }
    .tl-card__footer { display:flex; align-items:center; justify-content:space-between; padding:.4rem .85rem .55rem; border-top:1px solid var(--border); margin-top:.4rem; }
    .tl-card__cost { font-size:.72rem; color:var(--accent); font-weight:700; }
    .tl-card__actions { display:flex; align-items:center; justify-content:flex-end; gap:.4rem; flex-wrap:wrap; }
    .tl-card__btn { font-size:.62rem; padding:.22rem .6rem; border:1px solid var(--border); border-radius:20px; opacity:.55; -webkit-tap-highlight-color:transparent; color:var(--text); background:transparent; }
    .tl-card__btn:active { opacity:1; border-color:var(--accent); }
    .tl-map { width:30px; height:30px; padding:0; display:inline-flex; align-items:center; justify-content:center; border-radius:999px; opacity:1; background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.28); }
    .gmap-icon { width:22px; height:22px; display:block; flex-shrink:0; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
    .gmap-icon__bg,.gmap-icon__center { fill:#fff; }
    .gmap-icon__green { fill:#34A853; }
    .gmap-icon__blue { fill:#4285F4; }
    .gmap-icon__yellow { fill:#FBBC05; }
    .gmap-icon__red { fill:#EA4335; }
    [data-theme="light"] .tl-map { background:#fff; border-color:rgba(0,0,0,.14); box-shadow:0 1px 4px rgba(0,0,0,.12); }

    /* Parking */
    .tl-parking { margin-top:.42rem; display:flex; flex-direction:column; gap:.28rem; }
    .tl-parking__row { display:flex; align-items:center; gap:.42rem; min-width:0; }
    .tl-parking__badge { flex:0 0 auto; min-width:28px; padding:.12rem .35rem; border:1px solid rgba(114,167,255,.42); border-radius:999px; color:#8fc6ff; background:rgba(114,167,255,.08); font-size:.58rem; text-align:center; }
    .tl-parking__link { min-width:0; color:#8fc6ff; font-size:.68rem; line-height:1.4; text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tl-parking__meta { flex:0 0 auto; color:var(--muted); font-size:.6rem; white-space:nowrap; }
    .tl-parking__backup { opacity:.68; }
    .parking-panel { margin:.25rem 0 .75rem; border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden; }
    .parking-panel__toggle { width:100%; min-height:44px; display:flex; align-items:center; justify-content:space-between; gap:.7rem; padding:.65rem .75rem; color:var(--text); text-align:left; }
    .parking-panel__toggle strong { font-size:.78rem; }
    .parking-panel__toggle small { display:block; margin-top:.12rem; color:var(--muted); font-size:.62rem; font-weight:400; }
    .parking-panel__chev { color:var(--muted); transition:transform .2s; }
    .parking-panel.open .parking-panel__chev { transform:rotate(180deg); }
    .parking-panel__body { display:none; padding:.7rem .75rem .8rem; border-top:1px solid var(--border); }
    .parking-panel.open .parking-panel__body { display:block; }
    .parking-mode { display:grid; grid-template-columns:1fr 1fr; gap:.45rem; margin-bottom:.7rem; }
    .parking-mode button { min-height:40px; padding:.45rem .55rem; border:1px solid var(--border); border-radius:8px; color:var(--muted); background:var(--surface); font-size:.68rem; }
    .parking-mode button.active { border-color:#72a7ff; color:#8fc6ff; background:rgba(114,167,255,.08); }
    .parking-set { padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); margin-top:.55rem; }
    .parking-set__title { display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-bottom:.55rem; font-size:.7rem; font-weight:700; }
    .parking-set__grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
    .parking-set__grid .wide { grid-column:1/-1; }
    .parking-mini { display:flex; flex-direction:column; gap:.25rem; }
    .parking-mini label { color:var(--muted); font-size:.62rem; }
    .parking-mini input,.parking-mini textarea { width:100%; min-height:38px; padding:.45rem .55rem; border:1px solid var(--border); border-radius:7px; background:var(--surface2); color:var(--text); outline:none; font-size:.74rem; }
    .parking-mini textarea { min-height:56px; resize:vertical; }
    .parking-backup-toggle { width:100%; min-height:36px; margin-top:.55rem; border:1px dashed var(--border); border-radius:7px; color:var(--muted); font-size:.66rem; }
    .parking-backup-fields { display:none; margin-top:.55rem; }
    .parking-backup-fields.open { display:block; }
    @media(max-width:520px){.parking-set__grid{grid-template-columns:1fr}.parking-set__grid .wide{grid-column:auto}.tl-parking__row{flex-wrap:wrap}.tl-parking__link{flex:1 1 180px}.tl-parking__meta{flex:0 0 auto}}

    /* Fav btn, shared with index. */
    .tl-fav { font-size:1rem; line-height:1; color:rgba(120,120,120,.95); background:rgba(255,255,255,.88); border-color:rgba(0,0,0,.14); border-radius:999px; width:30px; height:30px; min-width:30px; display:inline-flex; align-items:center; justify-content:center; border:1px solid rgba(0,0,0,.14); -webkit-tap-highlight-color:transparent; transition:background .16s, border-color .16s, color .16s, box-shadow .16s; }
    .tl-fav.is-fav { color:#ff3f7f; background:rgba(255,63,127,.14); border-color:rgba(255,63,127,.55); text-shadow:0 0 4px rgba(255,63,127,.45), 0 0 8px rgba(255,63,127,.28); box-shadow:0 0 0 1px rgba(255,63,127,.12) inset, 0 0 8px rgba(255,63,127,.22); }
    [data-theme="dark"] .tl-fav { color:rgba(255,255,255,.82); background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.22); }
    [data-theme="dark"] .tl-fav.is-fav { color:#ff6fa3; background:rgba(255,111,163,.16); border-color:rgba(255,111,163,.6); text-shadow:0 0 5px rgba(255,111,163,.6), 0 0 12px rgba(255,111,163,.35); box-shadow:0 0 0 1px rgba(255,111,163,.18) inset, 0 0 12px rgba(255,111,163,.28); }
    [data-theme="light"] .tl-fav { color:rgba(50,50,50,.72); background:#fff; border-color:rgba(0,0,0,.16); }
    [data-theme="light"] .tl-fav.is-fav { color:#e72f75; background:rgba(231,47,117,.1); border-color:rgba(231,47,117,.42); text-shadow:0 0 3px rgba(231,47,117,.35), 0 0 7px rgba(231,47,117,.18); box-shadow:0 1px 4px rgba(0,0,0,.08), 0 0 8px rgba(231,47,117,.16); }
    @keyframes favPulse { 0%{transform:scale(1.5)} 70%{transform:scale(1.28)} 100%{transform:scale(1)} }
    .tl-fav.pulse { animation:favPulse .22s var(--ease); }

    /* Empty */
    .empty-day { text-align:center; padding:3rem 1rem; opacity:.3; }
    .empty-day__icon { font-size:2.5rem; margin-bottom:.75rem; }
    .empty-day__text { font-size:.85rem; letter-spacing:.15em; }

    /* Action toolbar */
    .action-bar { display:grid; grid-template-columns:1fr 1fr; gap:.55rem; padding:.75rem 1rem .35rem; }
    .action-btn { min-height:44px; padding:.55rem .7rem; border:1px solid var(--border); border-radius:8px; color:var(--text); background:var(--surface); font-size:.78rem; }
    .action-btn--primary { border-color:var(--accent); background:var(--accent); color:#fff; }
    .action-btn--flight { grid-column:1/-1; border-color:rgba(168,197,176,.55); color:var(--accent2); background:rgba(168,197,176,.08); }
    .action-btn--rental { grid-column:1/-1; border-color:rgba(114,167,255,.45); color:#72a7ff; background:rgba(114,167,255,.07); }
    .action-btn--clear { grid-column:1/-1; min-height:36px; color:var(--muted); background:transparent; }

    /* Day stats */
    .day-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; padding:.5rem 1rem .25rem; }
    .day-stat { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.6rem .75rem; text-align:center; }
    .day-stat__n { font-family:var(--serif); font-size:1.2rem; font-weight:700; display:block; color:var(--accent); }
    .day-stat__l { font-size:.6rem; opacity:.4; letter-spacing:.1em; display:block; margin-top:.15rem; }
    .route-bar { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; padding:.5rem 1rem .25rem; }
    .route-btn { min-height:42px; display:flex; align-items:center; justify-content:center; gap:.42rem; padding:.5rem .65rem; border:1px solid rgba(66,133,244,.38); border-radius:8px; color:#72a7ff; background:rgba(66,133,244,.07); font-size:.72rem; text-align:center; transition:transform .2s, border-color .2s, background .2s; }
    .route-btn:not(.disabled):active { transform:scale(.985); }
    .route-icon { width:18px; height:18px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .route-btn--b { color:#d2a8ff; border-color:rgba(180,120,255,.38); background:rgba(180,120,255,.07); }
    .route-btn.disabled { color:var(--muted); border-color:var(--border); background:var(--surface); opacity:.45; pointer-events:none; }

    /* Add button */
    .btn-add-item { width:calc(100% - 2rem); margin:0 1rem .75rem; padding:.65rem; border-radius:var(--r); border:1px dashed rgba(255,255,255,.18); color:var(--text); font-size:.82rem; letter-spacing:.08em; opacity:.6; transition:opacity .2s, border-color .2s; -webkit-tap-highlight-color:transparent; }
    .btn-add-item:active { opacity:1; border-color:var(--accent); }

    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:500; display:none; align-items:flex-end; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--surface); border-radius:16px 16px 0 0; padding:1.25rem 1.25rem calc(1.25rem + var(--safe-b)); width:100%; max-width:600px; max-height:85svh; overflow-y:auto; }
    .modal__title { font-family:var(--serif); font-size:1rem; font-weight:700; margin-bottom:1rem; }
    .modal-field { display:flex; flex-direction:column; gap:.3rem; margin-bottom:.65rem; }
    .modal-field label { font-size:.72rem; opacity:.55; letter-spacing:.08em; }
    .modal-field input, .modal-field select, .modal-field textarea { padding:.55rem .75rem; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:.84rem; outline:none; transition:border-color .2s; width:100%; resize:vertical; }
    [data-theme="light"] .modal-field input,
    [data-theme="light"] .modal-field select,
    [data-theme="light"] .modal-field textarea { color:#1A1A1A; }
    .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus { border-color:var(--accent); }
    .modal-field select option { color:#1A1A1A; background:#FFF; }
    .modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
    .conditional-fields { display:none; }
    .conditional-fields.open { display:block; }
    .flight-presets { display:grid; grid-template-columns:1fr 1fr; gap:.45rem; margin-bottom:.7rem; }
    .flight-preset { min-height:42px; padding:.45rem .6rem; border:1px solid rgba(168,197,176,.42); border-radius:7px; color:var(--accent2); background:rgba(168,197,176,.07); font-size:.72rem; text-align:left; }
    .flight-preset strong { display:block; color:var(--text); font-size:.75rem; }
    .flight-preset span { display:block; margin-top:.12rem; color:var(--muted); font-size:.62rem; }
    .btn-modal-save { width:100%; padding:.7rem; border-radius:8px; background:var(--accent); color:#fff; font-size:.88rem; letter-spacing:.1em; margin-top:.5rem; }
    .btn-modal-cancel { width:100%; padding:.6rem; border-radius:8px; border:1px solid var(--border); color:var(--text); font-size:.82rem; letter-spacing:.08em; margin-top:.4rem; opacity:.6; }

    /* Picker / help */

function writePresence() {

function releaseItineraryLock() {

async function acquireItineraryLock(date, key, name) {
  const current = getItineraryLock(date, key);
  if (activeLock(current) && current.sessionId !== COLLAB_SESSION_ID) {
    alert(`${current.name || '其他人'}正在編輯「${name}」，請稍後再試。`);

}
function connectCollaboration() {

// ── Stats & Summary ──
function itemClockDuration(item) {
  const start = timeToMinutes(item?.start);
  const end = timeToMinutes(item?.end);
  if (start === Number.MAX_SAFE_INTEGER || end === Number.MAX_SAFE_INTEGER) return 0;
  return end > start ? end - start : (end + 1440) - start;
}

function scheduleSpanMinutes(items) {
  const valid = items.filter(it => timeToMinutes(it.start) !== Number.MAX_SAFE_INTEGER && itemClockDuration(it) > 0);
  if (!valid.length) return 0;
  const first = Math.min(...valid.map(it => timeToMinutes(it.start)));
  const last = Math.max(...valid.map(it => timeToMinutes(it.start) + itemClockDuration(it)));
  return Math.max(0, last - first);
}

function updateStats(items) {
  const activities = items.filter(it => !['transit','commute'].includes(it.type));
  document.getElementById('stat-items').textContent = activities.length;
  let mins = 0;
  if (groupView === 'all') {
    const carAItems = items.filter(it => itemGroup(it) === 'all' || itemGroup(it) === 'carA');
    const carBItems = items.filter(it => itemGroup(it) === 'all' || itemGroup(it) === 'carB');
    mins = Math.max(scheduleSpanMinutes(carAItems), scheduleSpanMinutes(carBItems));
  } else {
    mins = scheduleSpanMinutes(items);
  }
  document.getElementById('stat-hours').textContent = mins > 0 ? `${Math.floor(mins / 60)}h${mins % 60 ? mins % 60 + 'm' : ''}` : '-';
  const cost = items.reduce((sum, it) => sum + (parseInt(it.cost) || 0), 0);
  document.getElementById('stat-cost').textContent = cost > 0 ? `¥${cost.toLocaleString()}` : '-';
}

function updateSummary(items) {
  const wrap = document.getElementById('day-summary');
  const activities = items.filter(it => !['transit','commute'].includes(it.type));
  wrap.innerHTML = activities.map(it => `<span class="summary-pill">${typeEmoji(it.type)} ${escapeHTML(it.name)}</span>`).join('');
}

function typeEmoji(t) { return {spot:'🏛',meal:'🍜',stay:'🏨',transit:'🚗',commute:'🚕',flight:'✈️',rental:'🚙',other:'📌'}[t] || '📌'; }
function typeLabel(t) { return {spot:'景點',meal:'餐廳',stay:'住宿',transit:'交通',commute:'通勤',flight:'航班',rental:'租車',other:'其他'}[t] || '其他'; }
function dotClass(t)  { return {meal:'tl-dot--meal',stay:'tl-dot--stay',transit:'tl-dot--transit'}[t] || ''; }
function timeToMinutes(value) {
  const match = String(value || '').match(/^(?:[01]?\d|2[0-3]):[0-5]\d$/);
  if (!match) return Number.MAX_SAFE_INTEGER;
  const [hours, minutes] = match[0].split(':').map(Number);
  return hours * 60 + minutes;
}
function normalizeTimeValue(value) {
  const minutes = timeToMinutes(value);
  if (!Number.isFinite(minutes) || minutes === Number.MAX_SAFE_INTEGER) return '';
  return `${String(Math.floor(minutes / 60)).padStart(2,'0')}:${String(minutes % 60).padStart(2,'0')}`;
}
function compareItineraryTime(a, b) {
  const difference = timeToMinutes(a.start) - timeToMinutes(b.start);
  if (difference) return difference;
  return String(a.createdAt || '').localeCompare(String(b.createdAt || '')) || String(a._key || '').localeCompare(String(b._key || ''));
}

function effectiveTransitAfter(item, nextItem) {
  if (!item || !nextItem) return 0;
  if (['transit','commute'].includes(item.type) || ['transit','commute'].includes(nextItem.type)) return 0;
  return Math.max(0, parseInt(item.transitMin) || 0);
}

function buildScheduleWarnings(allItems) {
  const warnings = new Map();
  const add = (item, message) => {
    if (!item?._key) return;
    if (!warnings.has(item._key)) warnings.set(item._key, new Set());
    warnings.get(item._key).add(message);
  };
  ['carA','carB'].forEach(group => {
    const timeline = allItems
      .filter(item => itemGroup(item) === 'all' || itemGroup(item) === group)
      .slice().sort(compareItineraryTime);
    for (let i = 1; i < timeline.length; i++) {
      const prev = timeline[i - 1];
      const current = timeline[i];
      const prevStart = timeToMinutes(prev.start);
      const currentStart = timeToMinutes(current.start);
      if (prevStart === Number.MAX_SAFE_INTEGER || currentStart === Number.MAX_SAFE_INTEGER) continue;
      const readyAt = prevStart + itemClockDuration(prev) + effectiveTransitAfter(prev, current);
      if (currentStart < readyAt) {
        const label = groupLabel(group);
        const gap = readyAt - currentStart;
        const transit = effectiveTransitAfter(prev, current);
        const detail = transit ? `（含前一站交通 ${transit} 分）` : '';
        add(current, `${label}：與「${prev.name || '前一行程'}」衝突，至少需延後 ${gap} 分${detail}`);
      }
    }
  });
  return warnings;
}

function routeStopsFor(items, group) {
  const excludedTypes = new Set(['transit','commute','flight']);
  const seen = new Set();
  return items.filter(item => {
    const belongs = itemGroup(item) === 'all' || itemGroup(item) === group;
    return belongs && !excludedTypes.has(item.type) && item.name;
  }).map(item => `${item.name}${item.city || item.region ? ' ' + (item.city || item.region) : ''} Japan`)
    .filter(stop => {
      if (seen.has(stop)) return false;
      seen.add(stop);
      return true;
    });
}

function googleRouteUrl(stops) {
  if (!stops.length) return '';
  if (stops.length === 1) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stops[0])}`;
  const origin = stops[0];
  const destination = stops[stops.length - 1];
  const waypoints = stops.slice(1, -1);
  let url = `https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}`;
  if (waypoints.length) url += `&waypoints=${encodeURIComponent(waypoints.join('|'))}`;
  return url;
}

function renderRouteLinks(allItems) {
  const aStops = routeStopsFor(allItems, 'carA');
  const bStops = routeStopsFor(allItems, 'carB');
  const routeIcon = `<svg class="route-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><path d="M8.5 18h3.25a3.25 3.25 0 0 0 0-6.5h.5a3.25 3.25 0 0 1 0-6.5h3.25"></path></svg>`;
  const button = (group, stops, extraClass = '') => {
    const url = googleRouteUrl(stops);
    const label = `${groupLabel(group)}今日路線${stops.length ? `（${stops.length}站）` : ''}`;
    return url
      ? `<a class="route-btn ${extraClass}" href="${url}" target="_blank" rel="noopener" aria-label="在 Google Maps 開啟${label}">${routeIcon}<span>${label}</span></a>`
      : `<span class="route-btn disabled ${extraClass}" aria-label="${label}尚無可用地點">${routeIcon}<span>${label}</span></span>`;
  };
  document.getElementById('route-bar').innerHTML = button('carA', aStops) + button('carB', bStops, 'route-btn--b');
}


function emptyParkingSpot() { return {name:'',mapsUrl:'',walkMin:0,fee:0,note:''}; }
function normalizeParkingSpot(raw) {
  if (!raw || typeof raw !== 'object') return emptyParkingSpot();
  return {
    name:String(raw.name || '').trim(), mapsUrl:String(raw.mapsUrl || '').trim(),
    walkMin:Math.max(0, parseInt(raw.walkMin) || 0), fee:Math.max(0, parseInt(raw.fee) || 0), note:String(raw.note || '').trim()
  };
}
function normalizeParking(raw) {
  const mode = raw?.mode === 'split' ? 'split' : 'shared';
  const set = value => ({primary:normalizeParkingSpot(value?.primary), backup:normalizeParkingSpot(value?.backup)});
  return {mode, shared:set(raw?.shared), carA:set(raw?.carA), carB:set(raw?.carB)};
}
function parkingHasSpot(spot) { return Boolean(spot?.name || spot?.mapsUrl); }
function parkingMapsUrl(spot, item) {

  if (!spot?.name) return '';

}
function parkingSetForItem(parking, group) {

  return parking[group] || {primary:emptyParkingSpot(),backup:emptyParkingSpot()};
}
function renderParkingRows(item) {

function itemMapsUrl(item) {
  const flightNo = String(item?.flightNo || '').toUpperCase().replace(/\s+/g, '');
  if (item?.type === 'flight') {
    const airport = flightNo === 'JX846'
      ? '桃園國際機場 第一航廈'
      : flightNo === 'JX847'
        ? '熊本機場 國內線・國際線航廈'
        : item.origin || item.name;
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(airport || '')}`;
  }
  if (item?.type === 'rental') {
    const point = item.city || item.region || item.name || '';
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${point} Japan`)}`;
  }
  const query = encodeURIComponent(`${item?.name || ''} ${item?.city || item?.region || ''} Japan`);
  return item?.googlePlaceId
    ? `https://www.google.com/maps/search/?api=1&query=${query}&query_place_id=${encodeURIComponent(item.googlePlaceId)}`

function resetParkingEditor() { fillParkingEditor(null); document.getElementById('parking-panel')?.classList.remove('open'); document.getElementById('parking-panel-toggle')?.setAttribute('aria-expanded','false'); }
function parkingAllowedForType(type) { return !['flight','rental','transit','commute'].includes(type); }
function toggleParkingVisibility() { const panel=document.getElementById('parking-panel'); if(panel) panel.hidden=!parkingAllowedForType(document.getElementById('m-type').value); }

function backendCall(name, data) {
  return waitFirebaseReady().then(() => {
    if (!window.__functions || !window.__httpsCallable) throw new Error('functions-unavailable');
    return window.__httpsCallable(window.__functions, name)(data).then(result => result.data);
  });
}

function numericLocation(value) {
  const latitude = Number(value?.latitude);
  const longitude = Number(value?.longitude);
  return Number.isFinite(latitude) && latitude >= -90 && latitude <= 90 && Number.isFinite(longitude) && longitude >= -180 && longitude <= 180
    ? {latitude, longitude}
    : null;
}

function placeForItem(item) {
  const key = String(item?.placeId || '');
  return key ? allPlaces().find(place => String(getPlaceFavKey(place)) === key) || null : null;
}

function routeTravelMode(item) {
  const value = String(item?.transitMode || '');
  if (value === 'DRIVE' || value.includes('開車')) return 'DRIVE';
  if (value === 'WALK' || value.includes('步行')) return 'WALK';
  return '';
}

function itemIdentity(item) {
  return String(item?.placeId || item?._key || item?.name || '');
}

function routeCacheKey(origin, destination, mode) {
  const part = location => `${location.latitude.toFixed(6)},${location.longitude.toFixed(6)}`;
  return `${part(origin)}|${part(destination)}|${mode}`;
}

function googleLegUrl(item, nextItem, mode) {
  const query = value => {
    const location = numericLocation(value) || numericLocation(placeForItem(value));
    return location ? `${location.latitude},${location.longitude}` : `${value?.name || ''} ${value?.city || value?.region || ''} Japan`;
  };
  return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(query(item))}&destination=${encodeURIComponent(query(nextItem))}&travelmode=${mode === 'WALK' ? 'walking' : 'driving'}`;
}

function routeInfoMatches(item, nextItem) {
  const info = item?.routeInfo;
  const mode = routeTravelMode(item);
  const origin = numericLocation(item) || numericLocation(placeForItem(item));
  const destination = numericLocation(nextItem) || numericLocation(placeForItem(nextItem));
  return Boolean(info && mode && origin && destination &&
    info.mode === mode &&
    info.originKey === itemIdentity(item) &&
    info.destinationKey === itemIdentity(nextItem) &&
    info.cacheKey === routeCacheKey(origin, destination, mode));
}

function routeErrorText(error) {
  const code = String(error?.code || '');
  if (code.includes('resource-exhausted')) return '請稍候再試';
  if (code.includes('deadline-exceeded')) return '計算逾時';
  if (code.includes('not-found')) return '找不到可用路線';
  if (code.includes('functions-unavailable') || code.includes('unavailable')) return '路程服務暫時無法使用';
  return '無法取得路程時間';
}

async function resolveItemLocation(item, date) {
  const direct = numericLocation(item);
  if (direct) return direct;
  const place = placeForItem(item);
  const fromPlace = numericLocation(place);
  if (fromPlace) return fromPlace;
  const address = String(item?.googleAddress || place?.googleAddress || '').trim();
  if (!address) throw new Error('location-unavailable');
  if (Object.prototype.hasOwnProperty.call(item, 'latitude') || Object.prototype.hasOwnProperty.call(item, 'longitude')) {
    throw new Error('location-unavailable');
  }
  const result = await backendCall('geocodeAddress', {address});
  const location = numericLocation(result);
  if (!location) throw new Error('location-unavailable');
  const fields = {
    latitude: location.latitude,
    longitude: location.longitude
  };
  if (!Object.prototype.hasOwnProperty.call(item, 'googleAddress')) fields.googleAddress = String(result.googleAddress || address);
  if (result.googlePlaceId && !item.googlePlaceId) fields.googlePlaceId = String(result.googlePlaceId);
  await window.__update(window.__ref(window.__db, `itinerary/${date}/${item._key}`), fields);
  Object.assign(item, fields);
  return location;
}

function journeyLegHtml(item, nextItem) {
  if (!nextItem) return '';
  const mode = routeTravelMode(item);
  if (!mode) return '';
  const state = routeLegStates.get(String(item._key));
  if (state?.status === 'loading') return `<div class="journey-leg is-loading"><span>${mode === 'DRIVE' ? '🚗' : '🚶'}</span><span>正在計算…</span></div>`;
  if (routeInfoMatches(item, nextItem)) {
    const info = item.routeInfo;
    return `<div class="journey-leg"><span>${mode === 'DRIVE' ? '🚗' : '🚶'}</span><strong>${Number(info.durationMinutes)} 分鐘</strong><span>· ${Number(info.distanceKm).toFixed(1)} km</span><a href="${escapeHTML(googleLegUrl(item,nextItem,mode))}" target="_blank" rel="noopener">Google Maps ↗</a><button type="button" data-route-recalc="${escapeHTML(item._key)}" aria-label="重新計算到下一站路程">重新計算</button></div>`;
  }
  const label = state?.status === 'error' ? state.message : Number(item.transitMin || 0) ? `${Number(item.transitMin)} 分（手動）` : '尚未計算';
  return `<div class="journey-leg is-error"><span>${mode === 'DRIVE' ? '🚗' : '🚶'}</span><span>${escapeHTML(label)}</span><button type="button" data-route-recalc="${escapeHTML(item._key)}">重試</button></div>`;
}

async function calculateAndStoreLeg(item, nextItem, date, force = false) {
  const mode = routeTravelMode(item);
  if (!item?._key || !nextItem || !mode) return;
  const requestId = (routeRequestIds.get(item._key) || 0) + 1;
  routeRequestIds.set(item._key, requestId);
  routeLegStates.set(item._key, {status:'loading'});
  renderDay();
  try {
    const [origin, destination] = await Promise.all([
      resolveItemLocation(item, date),
      resolveItemLocation(nextItem, date)
    ]);
    const cacheKey = routeCacheKey(origin, destination, mode);
    if (!force && routeInfoMatches(item, nextItem)) {
      routeLegStates.delete(item._key);
      renderDay();
      return;
    }
    const result = await backendCall('calculateRoute', {origin, destination, travelMode:mode});
    if (routeRequestIds.get(item._key) !== requestId) return;
    const routeInfo = {
      mode,
      durationSeconds:Number(result.durationSeconds),
      durationMinutes:Number(result.durationMinutes),
      distanceMeters:Number(result.distanceMeters),
      distanceKm:Number(result.distanceKm),
      originKey:itemIdentity(item),
      destinationKey:itemIdentity(nextItem),
      cacheKey,
      updatedAt:Date.now()
    };
    await window.__update(window.__ref(window.__db, `itinerary/${date}/${item._key}`), {routeInfo});
    if (routeRequestIds.get(item._key) !== requestId) return;
    item.routeInfo = routeInfo;
    routeLegStates.delete(item._key);
  } catch (error) {
    if (routeRequestIds.get(item._key) !== requestId) return;
    const message = error?.message === 'location-unavailable' ? '無法取得位置' : routeErrorText(error);
    routeLegStates.set(item._key, {status:'error', message});
  }
  renderDay();
}

function legSignatures(items) {
  const sorted = items.slice().sort(compareItineraryTime);
  const signatures = new Map();
  sorted.forEach((item, index) => {
    const next = sorted[index + 1];
    signatures.set(String(item._key), next ? `${itemIdentity(item)}|${itemIdentity(next)}|${routeTravelMode(item)}` : 'last');
  });
  return signatures;
}

async function recalculateChangedLegs(beforeItems, afterItems, date) {
  const before = legSignatures(beforeItems);
  const after = legSignatures(afterItems);
  const sorted = afterItems.slice().sort(compareItineraryTime);
  const tasks = [];
  sorted.forEach((item, index) => {
    if (before.get(String(item._key)) !== after.get(String(item._key))) {
      tasks.push(calculateAndStoreLeg(item, sorted[index + 1], date));
    }
  });
  await Promise.allSettled(tasks);
}

  const allItems = (itineraryData[date] || []).slice().sort(compareItineraryTime);

  updateSummary(items);
  renderRouteLinks(allItems);
  const scheduleWarnings = buildScheduleWarnings(allItems);

    tl.innerHTML = `<div class="empty-day"><div class="empty-day__icon">🗓</div><div class="empty-day__text">這天還沒有行程<br>可從景點總覽挑選或手動新增</div></div>`;

              <div class="tl-card__meta">
                <span class="tl-card__cat">${typeEmoji(it.type)} ${typeLabel(it.type)}</span>

                ${it.city ? `<span class="tl-card__cat">${escapeHTML(it.city)}</span>` : ''}

              </div>
              <div class="tl-card__name">${escapeHTML(it.name)}</div>
              ${it.type === 'flight' && (it.origin || it.destination) ? `<div class="tl-card__hours">${escapeHTML(it.origin || '')} → ${escapeHTML(it.destination || '')}${it.durationMin ? ` · ${Math.floor(it.durationMin / 60)}h${it.durationMin % 60 ? it.durationMin % 60 + 'm' : ''}` : ''}</div>` : ''}
              ${it.hours ? `<div class="tl-card__hours">🕐 營業：${escapeHTML(it.hours)}</div>` : ''}
              ${it.transitMin && !routeTravelMode(it) ? `<div class="tl-card__hours">🚗 到下一站：${Number(it.transitMin)} 分${it.transitMode ? ` · ${escapeHTML(it.transitMode)}` : ''}</div>` : ''}
              ${renderParkingRows(it)}

              ${it.note  ? `<p class="tl-card__note">${escapeHTML(it.note)}</p>` : ''}

              ${lockedByOther ? `<div class="tl-card__updated tl-card__lock">✎ ${escapeHTML(lock.name || '其他人')}正在編輯</div>` : ''}

      await window.__remove(window.__ref(window.__db, `itinerary/${date}/${key}`));
      const afterItems = beforeItems.filter(item => String(item._key) !== String(key));
      recalculateChangedLegs(beforeItems, afterItems, date);
    });
  });

  tl.querySelectorAll('.btn-edit').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key  = btn.dataset.key;
      const date = TRIP_DAYS[currentDay].date;
      const item = (itineraryData[date] || []).find(i => i._key === key);
      if (!item) return;
      if (!await acquireItineraryLock(date, key, item.name)) return;
      buildPlaceSuggestions();
      setupTimeInput('m-start');
      setupTimeInput('m-end');
      editingKey = key;
      editingDate = date;
      document.getElementById('m-type').value         = item.type || 'spot';
      document.getElementById('m-group').value        = itemGroup(item);
      document.getElementById('m-name').value         = item.name || '';
      document.getElementById('m-start').value        = normalizeTimeValue(item.start) || '09:00';
      document.getElementById('m-end').value          = normalizeTimeValue(item.end) || '10:00';
      document.getElementById('m-hours').value        = item.hours || '';
      document.getElementById('m-cost').value         = item.cost  || '';
      document.getElementById('m-transit').value      = item.transitMode || '';
      document.getElementById('m-transit-min').value  = item.transitMin  || '';
      document.getElementById('m-note').value         = item.note  || '';
      document.getElementById('m-city').value = item.city || getDayRegion();
      document.getElementById('m-flight-no').value = item.flightNo || '';
      document.getElementById('m-flight-duration').value = item.durationMin ? `${Math.floor(item.durationMin / 60)}:${String(item.durationMin % 60).padStart(2, '0')}` : '';
      document.getElementById('m-origin').value = item.origin || '';
      document.getElementById('m-destination').value = item.destination || '';
      fillParkingEditor(item.parking);
      document.getElementById('modal-title').textContent = '編輯行程項目';
      toggleFlightFields();
      toggleParkingVisibility();
      document.getElementById('modal-overlay').classList.add('open');
    });
  });

  tl.querySelectorAll('[data-route-recalc]').forEach(btn => {
    btn.addEventListener('click', () => {
      const index = items.findIndex(item => String(item._key) === btn.dataset.routeRecalc);
      if (index >= 0) calculateAndStoreLeg(items[index], items[index + 1], date, true);
    });
  });

}

// ── Helpers: normalize / autofill ──
function normalizeName(s) { return (s || '').trim().toLowerCase(); }

function guessItemType(place) {
  if (!place) return 'spot';
  if (place.category === '餐廳') return 'meal';
  if (place.category === '住宿') return 'stay';
  if (place.category === '其他') return 'other';
  return 'spot';
}

function getPlaceDuration(place) {
  const configured = DURATION_DEFAULT[place?.subcategory] ?? DURATION_DEFAULT[place?.category];
  return Number.isFinite(Number(configured)) && Number(configured) > 0 ? Number(configured) : 30;
}

function setEndByStartAndPlace() {
  const name  = document.getElementById('m-name')?.value || '';
  const start = document.getElementById('m-start')?.value || '';
  if (!start || !/^([01]?\d|2[0-3]):[0-5]\d$/.test(start)) return;
  const place  = allPlaces().find(p => normalizeName(p.name) === normalizeName(name));
  const dur    = getPlaceDuration(place);
  const [h, m] = start.split(':').map(Number);
  const endMin = h * 60 + m + dur;
  document.getElementById('m-end').value =
    `${String(Math.floor(endMin / 60) % 24).padStart(2,'0')}:${String(endMin % 60).padStart(2,'0')}`;
}

function buildPlaceSuggestions() {
  const dl  = document.getElementById('place-suggestions');
  if (!dl) return;
  const map = new Map();
  allPlaces().forEach(p => { if (p.name && !map.has(p.name)) map.set(p.name, p); });
  dl.innerHTML = [...map.keys()].sort((a, b) => a.localeCompare(b, 'zh-Hant'))
    .map(n => `<option value="${n.replace(/"/g,'&quot;')}"></option>`).join('');
}

function autofillPlaceFields() {
  const name    = document.getElementById('m-name')?.value || '';
  const target  = normalizeName(name);
  if (!target) return;
  const region  = document.getElementById('m-city')?.value.trim() || getDayRegion();
  const matches = allPlaces().filter(p => normalizeName(p.name) === target);
  if (!matches.length) return;
  const first   = matches.find(p => region && regionMatches(p.region, region)) || matches[0];
  if (!first) return;
  const typeField = document.getElementById('m-type');
  if (typeField.value === 'spot') typeField.value = guessItemType(first);
  if (!document.getElementById('m-hours').value.trim() && first.hours) document.getElementById('m-hours').value = first.hours;
  if (!document.getElementById('m-note').value.trim()  && first.note)  document.getElementById('m-note').value  = first.note;
  if (!document.getElementById('m-cost').value && first.cost) document.getElementById('m-cost').value = parseInt(first.cost) || 0;
  setEndByStartAndPlace();
}

function setupTimeInput(id) {
  const el = document.getElementById(id);
  if (!el || el.dataset.timeReady) return;
  el.dataset.timeReady = '1';
  el.addEventListener('input', e => {
    let v = e.target.value.replace(/[^0-9]/g, '');
    if (v.length >= 3) v = v.slice(0, 2) + ':' + v.slice(2, 4);
    e.target.value = v;
  });
  el.addEventListener('blur', e => {
    e.target.style.borderColor = /^([01]?\d|2[0-3]):[0-5]\d$/.test(e.target.value) ? '' : '#ff6b6b';
  });
}

function toggleFlightFields() {
  const type = document.getElementById('m-type').value;
  const isFlight = type === 'flight';
  const isRental = type === 'rental';
  document.getElementById('flight-fields').classList.toggle('open', isFlight);
  document.getElementById('rental-fields').classList.toggle('open', isRental);
  if (isFlight && !document.getElementById('m-name').value.trim()) document.getElementById('m-name').value = '飛機航班';
  if (isRental && !document.getElementById('m-name').value.trim()) document.getElementById('m-name').value = '租車';
}

  const flight = FLIGHT_PRESETS[flightNo];
  if (!flight) return;
  const dayIndex = TRIP_DAYS.findIndex(day => day.date === flight.date);
  if (dayIndex >= 0 && dayIndex !== currentDay) {
    currentDay = dayIndex;
    buildTabs();
    buildDayRegionSelect();
  }
  document.getElementById('m-type').value = 'flight';
  document.getElementById('m-name').value = flight.name;
  document.getElementById('m-city').value = '移動日';
  document.getElementById('m-start').value = flight.start;
  document.getElementById('m-end').value = flight.end;
  document.getElementById('m-flight-no').value = flightNo;
  document.getElementById('m-flight-duration').value = flight.duration;

  document.getElementById('m-note').value = flight.note;
  document.getElementById('modal-title').textContent = `加入航班 ${flightNo}`;
  toggleFlightFields();
}

function parseDuration(value) {
  const [hours, minutes] = String(value || '').split(':').map(Number);
  return Number.isFinite(hours) && Number.isFinite(minutes) ? hours * 60 + minutes : 0;
}

const RENTAL_FIELDS = ['pickup-date','pickup-time','return-date','return-time','rental-location','pickup-loc','return-loc','company','car','cost','booking'];
function normalizeRentalInfo(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {carA:null,carB:null};
  const legacy = RENTAL_FIELDS.some(field => Object.prototype.hasOwnProperty.call(raw, field)) ? raw : null;
  return {
    carA: raw.carA && typeof raw.carA === 'object' ? {...legacy, ...raw.carA} : legacy,
    carB: raw.carB && typeof raw.carB === 'object' ? raw.carB : null
  };
}
function addMinutesToClock(value, minutesToAdd) {
  const base = timeToMinutes(value);
  if (base === Number.MAX_SAFE_INTEGER) return '';
  const total = (base + minutesToAdd) % 1440;
  return `${String(Math.floor(total / 60)).padStart(2,'0')}:${String(total % 60).padStart(2,'0')}`;
}
function applyRentalPreset(group, eventType) {
  const data = rentalInfoCache[group];
  if (!RENTAL_GROUP_LABELS[group] || !data) { alert('尚未讀到這台車的租車資訊，請先在總覽頁儲存租車資料。'); return false; }
  const isReturn = eventType === 'return';
  const date = data[isReturn ? 'return-date' : 'pickup-date'];
  const start = data[isReturn ? 'return-time' : 'pickup-time'];
  if (!date || !start) { alert(`請先在總覽頁填寫${RENTAL_GROUP_LABELS[group]}的${isReturn ? '還車' : '取車'}日期與時間。`); return false; }
  const dayIndex = TRIP_DAYS.findIndex(day => day.date === date);
  if (dayIndex < 0) { alert('租車日期不在目前旅遊日期範圍內。'); return false; }
  if (dayIndex !== currentDay) { currentDay = dayIndex; buildTabs(); buildDayRegionSelect(); }
  const label = RENTAL_GROUP_LABELS[group];
  const company = String(data.company || '').trim();
  const branch = String(data['rental-location'] || '').trim();
  const point = String(data[isReturn ? 'return-loc' : 'pickup-loc'] || '').trim();
  const action = isReturn ? '還車' : '取車';
  const where = point || branch || company || '租車地點';
  const detail = [company, branch && branch !== company ? branch : '', data.car ? `車型：${data.car}` : '', data.booking ? `預訂編號：${data.booking}` : '', data.cost ? `租車費用：NT$${Number(data.cost).toLocaleString()}` : ''].filter(Boolean).join('；');
  document.getElementById('m-type').value = 'rental';
  document.getElementById('m-group').value = group;
  document.getElementById('m-name').value = `${label} ${action}｜${where}`;
  document.getElementById('m-city').value = where;
  document.getElementById('m-start').value = normalizeTimeValue(start);
  document.getElementById('m-end').value = addMinutesToClock(start, 30);
  document.getElementById('m-cost').value = '';
  document.getElementById('m-transit').value = '';
  document.getElementById('m-transit-min').value = '';
  document.getElementById('m-note').value = detail;
  document.getElementById('m-flight-no').value = '';
  document.getElementById('m-flight-duration').value = '';
  document.getElementById('m-origin').value = '';
  document.getElementById('m-destination').value = '';
  document.getElementById('modal-title').textContent = `${label} ${action}加入行程`;
  toggleFlightFields();
  return true;
}
function tryApplyPendingRentalRequest() {
  if (rentalRequestHandled) return;
  const {group, eventType} = pendingRentalRequest;
  if (!RENTAL_GROUP_LABELS[group] || !['pickup','return'].includes(eventType)) return;
  if (!rentalInfoCache[group]) return;
  rentalRequestHandled = true;
  openNewItemModal('rental');
  if (applyRentalPreset(group, eventType)) history.replaceState(null, '', location.pathname);
}

function getPickerCategorySourcePlaces() {
  const dayRegions = getDayRegions();
  return allPlaces().filter(place => {
    const region = String(place.region || '');
    const matchesDay = !dayRegions.length || dayRegions.some(dayRegion => regionMatches(region, dayRegion));
    const matchesRegion = pickerRegion === '全部' || regionMatches(region, pickerRegion);
    return matchesDay && matchesRegion;
  });
}

function renderPickerCategoryFilters() {

function getPickerSubcategorySourcePlaces() {

function renderSelectedRouteTimes() {
  const wrap = document.getElementById('picker-route-times');

function renderPlacePicker() {
  const query = document.getElementById('picker-search').value.trim().toLowerCase();
  const dayRegions = getDayRegions();
  const places = allPlaces().filter(place => {
    const region = String(place.region || '');
    const matchesDay = !dayRegions.length || dayRegions.some(dayRegion => regionMatches(region, dayRegion));
    const matchesFilter = pickerRegion === '全部' || regionMatches(region, pickerRegion);
    const category = String(place.category || '景點').trim() || '景點';
    const subcategory = String(place.subcategory || '').trim();
    const matchesCategory = pickerCategory === '全部' || category === pickerCategory;
    const matchesSubcategory = pickerSubcategory === '全部' || subcategory === pickerSubcategory;
    const haystack = `${place.name || ''} ${region} ${category} ${subcategory} ${place.note || ''}`.toLowerCase();
    return matchesDay && matchesFilter && matchesCategory && matchesSubcategory && (!query || haystack.includes(query));
  });
  document.getElementById('picker-list').innerHTML = places.length ? places.map(place => {
    const id = getPlaceFavKey(place);
    const selected = selectedPlaceIds.has(id);
    return `<button class="picker-place${selected ? ' selected' : ''}" type="button" data-place-id="${escapeHTML(id)}"><span class="picker-place__check">${selected ? '✓' : ''}</span><span><strong>${escapeHTML(place.name)}</strong><small>${escapeHTML(place.category || '景點')}${place.subcategory ? ` · ${escapeHTML(place.subcategory)}` : ''}${place.note ? ` · ${escapeHTML(place.note)}` : ''}</small></span><small>${escapeHTML(place.region || '')}</small></button>`;
  }).join('') : '<div class="empty-day"><div class="empty-day__text">目前條件沒有可加入的地點</div></div>';

  renderSelectedRouteTimes();
}

async function addSelectedPlaces() {
  if (!selectedPlaceIds.size) return;
  const pickerStart = document.getElementById('picker-start').value;
  if (!pickerStart) { alert('請先填寫第一個景點的開始時間'); return; }
  await waitFirebaseReady();
  const date = TRIP_DAYS[currentDay].date;
  const beforeItems = (itineraryData[date] || []).map(item => ({...item}));
  const createdItems = [];
  let startMinutes = timeToMinutes(pickerStart);
  const travelGroup = document.getElementById('picker-group').value || 'all';
  const actor = collaboratorName() || '未指定';
  const placeById = new Map(allPlaces().map(place => [String(getPlaceFavKey(place)), place]));
  const selected = [...selectedPlaceIds].map(id => placeById.get(String(id))).filter(Boolean);
  for (let index = 0; index < selected.length; index++) {
    const place = selected[index];
    const duration = getPlaceDuration(place);
    const start = `${String(Math.floor(startMinutes / 60) % 24).padStart(2, '0')}:${String(startMinutes % 60).padStart(2, '0')}`;
    startMinutes += duration;
    const end = `${String(Math.floor(startMinutes / 60) % 24).padStart(2, '0')}:${String(startMinutes % 60).padStart(2, '0')}`;
    const placeId = String(getPlaceFavKey(place));
    const transitMin = index < selected.length - 1 ? Math.max(0, parseInt(selectedTransitMinutes.get(placeId)) || 0) : 0;
    const location = numericLocation(place);
    const locationFields = location ? {
      latitude:location.latitude,
      longitude:location.longitude,
      ...(place.googlePlaceId ? {googlePlaceId:String(place.googlePlaceId)} : {}),
      ...(place.googleAddress ? {googleAddress:String(place.googleAddress)} : {})
    } : {};
    const savedRef = await window.__push(window.__ref(window.__db, `itinerary/${date}`), {
      type: guessItemType(place), name: place.name || '', city: place.region || '', start, end,
      hours: place.hours || '', cost: parseInt(place.cost) || 0, note: place.note || '',
      region: place.region || '', category: place.category || '', subcategory: place.subcategory || '',
      placeId: getPlaceFavKey(place), travelGroup, transitMin,
      createdAt: new Date().toISOString(), updatedAt:new Date().toISOString(), updatedBy:actor,
      ...locationFields
    });
    createdItems.push({
      _key:savedRef.key, type:guessItemType(place), name:place.name || '', city:place.region || '', start, end,
      region:place.region || '', placeId:getPlaceFavKey(place), travelGroup, transitMin, ...locationFields
    });
    startMinutes += transitMin;
  }
  document.getElementById('picker-overlay').classList.remove('open');
  selectedPlaceIds.clear();
  selectedTransitMinutes.clear();
  recalculateChangedLegs(beforeItems, [...beforeItems, ...createdItems], date);
}

document.getElementById('btn-modal-save').addEventListener('click', async () => {
  const name     = document.getElementById('m-name').value.trim();
  if (!name) { alert('請填寫名稱'); return; }
  const startVal = document.getElementById('m-start').value.trim();
  const endVal   = document.getElementById('m-end').value.trim();
  if (!/^([01]?\d|2[0-3]):[0-5]\d$/.test(startVal) || !/^([01]?\d|2[0-3]):[0-5]\d$/.test(endVal)) { alert('請輸入正確的 24 小時制時間，例如 09:00'); return; }
  const selectedType  = document.getElementById('m-type').value;
  if (selectedType === 'flight') {
    const flightDurationText = document.getElementById('m-flight-duration').value.trim();
    if (flightDurationText && !/^\d{1,2}:[0-5]\d$/.test(flightDurationText)) { alert('飛行時間請使用 H:MM 格式，例如 2:15'); return; }
  }

  const date          = editingDate || TRIP_DAYS[currentDay].date;
  const region        = document.getElementById('m-city').value || getDayRegion(date);
  const matchedPlaces = allPlaces().filter(p => normalizeName(p.name) === normalizeName(name));
  const matchedPlace  = matchedPlaces.find(p => region && regionMatches(p.region, region)) || matchedPlaces[0] || null;
  const durationMin   = selectedType === 'flight' ? parseDuration(document.getElementById('m-flight-duration').value) : 0;
  const existingItem  = editingKey ? (itineraryData[date] || []).find(existing => existing._key === editingKey) : null;
  const beforeItems   = (itineraryData[date] || []).map(existing => ({...existing}));
  const matchedLocation = numericLocation(matchedPlace);
  const linkedFields = matchedPlace ? {
    ...(matchedLocation && !Object.prototype.hasOwnProperty.call(existingItem || {}, 'latitude') && !Object.prototype.hasOwnProperty.call(existingItem || {}, 'longitude')
      ? {latitude:matchedLocation.latitude, longitude:matchedLocation.longitude} : {}),
    ...(matchedPlace.googlePlaceId && !Object.prototype.hasOwnProperty.call(existingItem || {}, 'googlePlaceId')
      ? {googlePlaceId:String(matchedPlace.googlePlaceId)} : {}),
    ...(matchedPlace.googleAddress && !Object.prototype.hasOwnProperty.call(existingItem || {}, 'googleAddress')
      ? {googleAddress:String(matchedPlace.googleAddress)} : {})
  } : {};

  const item = {
    ...(existingItem || {}),
    type:        selectedType,
    name, start: startVal, end: endVal,
    city:         region,
    hours:       document.getElementById('m-hours').value.trim() || matchedPlace?.hours || '',
    cost:        parseInt(document.getElementById('m-cost').value) || parseInt(matchedPlace?.cost) || 0,
    transitMode: document.getElementById('m-transit').value,
    transitMin:  parseInt(document.getElementById('m-transit-min').value) || 0,
    note:        document.getElementById('m-note').value.trim() || matchedPlace?.note || '',
    region:      matchedPlace?.region || region || '',
    category:    matchedPlace?.category || '',
    subcategory: matchedPlace?.subcategory || '',
    placeId:     matchedPlace ? getPlaceFavKey(matchedPlace) : '',
    durationMin: durationMin || 0,
    flightNo:    document.getElementById('m-flight-no').value.trim(),
    origin:      document.getElementById('m-origin').value.trim(),
    destination: document.getElementById('m-destination').value.trim(),
    travelGroup: document.getElementById('m-group').value || 'all',
    parking:     parkingAllowedForType(selectedType) ? readParkingEditor() : null,
    createdAt:   existingItem?.createdAt || new Date().toISOString(),
    updatedAt:   new Date().toISOString(),
    updatedBy:   collaboratorName() || '未指定',
    ...linkedFields
  };
  delete item._key;
  const originalEditingKey = editingKey;

  try {
    await waitFirebaseReady();
    let savedKey = originalEditingKey;
    if (originalEditingKey) {
      await window.__update(window.__ref(window.__db, `itinerary/${date}/${originalEditingKey}`), item);
    } else {
      const savedRef = await window.__push(window.__ref(window.__db, `itinerary/${date}`), item);
      savedKey = savedRef.key;
    }
    closeItemModal();
    const savedItem = {...item, _key:savedKey};
    const afterItems = originalEditingKey
      ? beforeItems.map(existing => existing._key === originalEditingKey ? savedItem : existing)
      : [...beforeItems, savedItem];
    recalculateChangedLegs(beforeItems, afterItems, date);
  } catch (error) {
    console.error('行程儲存失敗：', error);
    alert('行程儲存失敗，請確認 Firebase 登入與寫入權限。');
  }
});

function placeTourCard() {
  const card = document.getElementById('tour-card');
  if (!tourTarget) {
    card.dataset.placement = 'bottom';
    return;
  }
  const rect = tourTarget.getBoundingClientRect();
  const viewportHeight = window.visualViewport?.height || window.innerHeight;
  const cardHeight = Math.min(viewportHeight * 0.32, 280);
  const bottomNavSpace = 92;
  const spaceAbove = rect.top;
  const spaceBelow = viewportHeight - rect.bottom - bottomNavSpace;
  card.dataset.placement = spaceAbove >= cardHeight && spaceAbove >= spaceBelow ? 'top' : 'bottom';
}

function renderTourStep() {
  tourTarget?.classList.remove('tour-target');
  const step = TOUR_STEPS[tourIndex];
  tourTarget = document.querySelector(step.target);
  if (tourTarget) {
    tourTarget.classList.add('tour-target');
    tourTarget.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
  document.getElementById('tour-progress').textContent = `${tourIndex + 1} / ${TOUR_STEPS.length}`;
  document.getElementById('tour-title').textContent = step.title;
  document.getElementById('tour-body').textContent = step.body;
  document.getElementById('tour-prev').disabled = tourIndex === 0;
  document.getElementById('tour-next').textContent = tourIndex === TOUR_STEPS.length - 1 ? '完成' : '下一步';
  placeTourCard();
  requestAnimationFrame(placeTourCard);
  setTimeout(placeTourCard, 260);
}

function startTour() {
  tourIndex = 0;
  document.getElementById('help-overlay').classList.add('open');
  document.getElementById('help-overlay').setAttribute('aria-hidden', 'false');
  document.getElementById('tour-card').classList.add('open');
  renderTourStep();
}

document.getElementById('help-btn').addEventListener('click', startTour);
document.getElementById('tour-close').addEventListener('click', closeTour);
document.getElementById('tour-prev').addEventListener('click', () => { if (tourIndex > 0) { tourIndex--; renderTourStep(); } });
document.getElementById('tour-next').addEventListener('click', () => {
  if (tourIndex === TOUR_STEPS.length - 1) { closeTour(); return; }
  tourIndex++;
  renderTourStep();
});
renderRouteLinks([]);
// 使用說明由右上角按鈕開啟，避免第一次進入時遮住 Today 首屏。

document.getElementById('m-name').addEventListener('change', autofillPlaceFields);
document.getElementById('m-name').addEventListener('blur',   autofillPlaceFields);
document.getElementById('m-start').addEventListener('change', setEndByStartAndPlace);

// ── Firebase ──
function waitFirebase(cb) {
  if (window.__firebaseReady) { cb(); return; }
  window.addEventListener('firebase-ready', cb, { once: true });
}

waitFirebase(() => {
  const db = window.__db;

  window.__onValue(window.__ref(db, 'day_regions'), snap => {
    dayRegionMap = snap.val() || {};
    buildTabs(); buildDayRegionSelect();
  });

  window.__onValue(window.__ref(db, 'favs'), snap => {
    const raw = snap.val();
    if (!raw) { favsCache = []; return; }
    if (Array.isArray(raw)) {
      favsCache = raw.flatMap((v, i) => v === true ? [String(i)] : typeof v === 'string' || typeof v === 'number' ? [String(v)] : []).filter(Boolean);
    } else if (typeof raw === 'object') {
      favsCache = Object.entries(raw).flatMap(([k, v]) => {
        if (v === true) return [String(k)];
        if (typeof v === 'string' || typeof v === 'number') return [String(v)];
        if (v && typeof v === 'object') {
          if (v.id !== undefined && v.id !== null) return [String(v.id)];
          if (v.placeId !== undefined && v.placeId !== null) return [String(v.placeId)];
        }
        return [];
      }).filter(Boolean);
    } else {
      favsCache = [];
    }
  });

  window.__onValue(window.__ref(db, 'base_places'), snap => {
    const raw = snap.val() || {};
    allBasePlaces = Object.entries(raw).map(([k, v]) => ({
      ...(v || {}),
      _key: k,
      id: v && v.id !== undefined && v.id !== null && String(v.id).trim() ? v.id : k
    }));
    buildPlaceSuggestions();
  });

  window.__onValue(window.__ref(db, 'custom_places'), snap => {
    const raw = snap.val() || {};
    allCustomPlaces = Object.entries(raw).map(([k, v]) => ({
      ...(v || {}),
      _key: k,
      id: v && v.id !== undefined && v.id !== null && String(v.id).trim() ? v.id : k
    }));
    buildPlaceSuggestions();
  });

  window.__onValue(window.__ref(db, 'rental_info'), snap => {
    rentalInfoCache = normalizeRentalInfo(snap.val());
    tryApplyPendingRentalRequest();
  }, error => console.warn('租車資訊讀取失敗：', error));

  window.__onValue(window.__ref(db, 'itinerary'), snap => {
    const raw = snap.val() || {};
    itineraryData = {};
    Object.entries(raw).forEach(([date, items]) => {
      itineraryData[date] = Object.entries(items).map(([k, v]) => ({ ...v, _key: k }));
    });
    renderDay();
  });

  buildTabs(); buildDayRegionSelect(); renderDay();
});
initCollaboration();
window.addEventListener('pagehide', () => {
  if (!window.__firebaseReady) return;
  window.__remove(window.__ref(window.__db, `collaborators_presence/${COLLAB_SESSION_ID}`)).catch(() => {});
  releaseItineraryLock();
});
</script>
