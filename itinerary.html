<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>每日行程表 — 九州 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0D0D0D;--surface:#141414;--surface2:#1C1C1C;
      --border:rgba(255,255,255,0.09);--text:#E8E8E8;--muted:rgba(232,232,232,0.48);
      --accent:#E8734A;--accent2:#A8C5B0;--purple:#B8AFFF;
      --serif:"Noto Serif JP",serif;--sans:"Noto Sans TC",sans-serif;
      --r:10px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
    }
    [data-theme="light"]{--bg:#F5F2EE;--surface:#FFF;--surface2:#F0EDE9;--border:rgba(0,0,0,0.1);--text:#1A1A1A;--muted:rgba(26,26,26,0.55);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{-webkit-text-size-adjust:100%;}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);overflow-x:hidden;padding-bottom:calc(64px + var(--safe-b));transition:background .3s,color .3s;}
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;cursor:pointer;border:none;background:none;}
    input,select,textarea{font-family:inherit;}

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:200;background:rgba(13,13,13,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 1rem;padding-top:var(--safe-t);display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:.5rem;}
    [data-theme="light"] .topbar{background:rgba(245,242,238,.95);}
    .topbar__left{display:flex;align-items:center;gap:.6rem;}
    .topbar__back{font-size:.8rem;opacity:.55;padding:.4rem;min-height:44px;display:flex;align-items:center;}
    .topbar__title{font-family:var(--serif);font-size:.9rem;letter-spacing:.15em;}
    .icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;border:1px solid var(--border);background:var(--surface);color:var(--text);}

    /* Date Tabs */
    .date-tabs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--border);background:var(--surface);}
    .date-tabs::-webkit-scrollbar{display:none;}
    .date-tab{flex:0 0 auto;scroll-snap-align:start;padding:.6rem .9rem;font-size:.72rem;letter-spacing:.06em;white-space:nowrap;opacity:.4;border-bottom:2px solid transparent;transition:opacity .2s,border-color .2s;cursor:pointer;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
    .date-tab__day{font-family:var(--serif);font-size:1rem;font-weight:700;line-height:1;}
    .date-tab__region{font-size:.58rem;letter-spacing:.08em;margin-top:1px;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .date-tab.active{opacity:1;border-bottom-color:var(--accent);color:var(--accent);}

    /* 城市選擇器 */
    .region-picker{display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;border-bottom:1px solid var(--border);background:var(--surface2);flex-wrap:wrap;}
    .region-picker__label{font-size:.72rem;opacity:.5;white-space:nowrap;letter-spacing:.08em;}
    .region-chips{display:flex;gap:.35rem;flex-wrap:wrap;flex:1;}
    .region-chip{padding:.32rem .75rem;border-radius:20px;border:1px solid var(--border);font-size:.72rem;white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s,color .15s;-webkit-tap-highlight-color:transparent;background:var(--bg);}
    .region-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}

    /* 心願清單 Panel */
    .wishlist-panel{border-bottom:1px solid var(--border);}
    .wishlist-panel__header{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:44px;}
    .wishlist-panel__title{font-size:.8rem;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;gap:.4rem;}
    .wishlist-panel__count{font-size:.65rem;background:var(--accent);color:#fff;border-radius:20px;padding:.1rem .5rem;}
    .wishlist-panel__toggle{font-size:.7rem;opacity:.4;transition:transform .25s;}
    .wishlist-panel.open .wishlist-panel__toggle{transform:rotate(180deg);}
    .wishlist-panel__body{display:none;padding:.4rem .75rem .65rem;}
    .wishlist-panel.open .wishlist-panel__body{display:block;}

    /* 心願清單分類 */
    .wl-section{margin-bottom:.6rem;}
    .wl-section__title{font-size:.65rem;opacity:.4;letter-spacing:.1em;margin-bottom:.35rem;padding-left:.1rem;}
    .wl-items{display:flex;flex-wrap:wrap;gap:.35rem;}
    .wl-chip{display:flex;align-items:center;gap:.3rem;padding:.3rem .65rem .3rem .5rem;border-radius:20px;border:1px solid var(--border);font-size:.72rem;cursor:pointer;transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent;background:var(--surface);}
    .wl-chip:active{border-color:var(--accent);}
    .wl-chip.added{background:rgba(168,197,176,.15);border-color:var(--accent2);color:var(--accent2);}
    .wl-chip__icon{font-size:.85rem;line-height:1;}
    .wl-chip__name{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .wl-chip__hours{font-size:.58rem;opacity:.45;margin-left:.15rem;}
    .wl-empty{font-size:.75rem;opacity:.3;padding:.5rem .1rem;}

    /* AI Bar */
    .ai-bar{margin:.5rem 1rem .3rem;padding:.75rem 1rem;background:linear-gradient(135deg,rgba(184,175,255,.1),rgba(232,115,74,.08));border:1px solid rgba(184,175,255,.25);border-radius:var(--r);}
    .ai-bar__title{font-size:.78rem;font-weight:700;color:var(--purple);margin-bottom:.35rem;}
    .ai-bar__desc{font-size:.7rem;color:var(--muted);margin-bottom:.55rem;line-height:1.6;}
    .ai-bar__actions{display:flex;gap:.45rem;flex-wrap:wrap;}
    .btn-ai{padding:.45rem .9rem;border-radius:8px;font-size:.76rem;letter-spacing:.06em;-webkit-tap-highlight-color:transparent;transition:opacity .2s;}
    .btn-ai--primary{background:var(--purple);color:#1A1535;}
    .btn-ai--secondary{background:transparent;border:1px solid var(--purple);color:var(--purple);}
    .btn-ai:active{opacity:.7;}
    .btn-ai:disabled{opacity:.35;cursor:not-allowed;}

    /* 統計 */
    .day-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;padding:.4rem 1rem .2rem;}
    .day-stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.5rem .6rem;text-align:center;}
    .day-stat__n{font-family:var(--serif);font-size:1.1rem;font-weight:700;display:block;color:var(--accent);}
    .day-stat__l{font-size:.58rem;opacity:.4;letter-spacing:.1em;display:block;margin-top:.1rem;}

    /* 行程摘要 */
    .day-summary{display:flex;gap:.4rem;padding:.4rem 1rem;overflow-x:auto;scrollbar-width:none;}
    .day-summary::-webkit-scrollbar{display:none;}
    .summary-pill{flex:0 0 auto;font-size:.65rem;padding:.22rem .6rem;border-radius:20px;border:1px solid var(--border);background:var(--surface2);white-space:nowrap;}

    /* Timeline */
    .timeline{padding:.6rem 1rem .5rem;display:flex;flex-direction:column;}
    .tl-item{display:grid;grid-template-columns:52px 1fr;position:relative;}
    .tl-item::before{content:"";position:absolute;left:25px;top:30px;bottom:-6px;width:2px;background:var(--border);z-index:0;}
    .tl-item:last-child::before{display:none;}
    .tl-time{padding-top:5px;text-align:right;padding-right:10px;}
    .tl-time__h{font-family:var(--serif);font-size:.85rem;font-weight:700;color:var(--accent);line-height:1;}
    .tl-time__m{font-size:.6rem;opacity:.4;}
    .tl-dot{position:absolute;left:20px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);z-index:1;}
    .tl-dot--transit{background:rgba(255,255,255,.2);}
    .tl-dot--meal{background:#FFD700;}
    .tl-dot--stay{background:var(--accent2);}
    .tl-card{margin-left:18px;margin-bottom:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .2s;}
    .tl-card--transit{background:transparent;border:none;padding:.25rem 0 .25rem .7rem;}
    .tl-transit-label{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:.35rem;}
    .tl-card__main{padding:.6rem .8rem .45rem;}
    .tl-card__meta{display:flex;align-items:center;gap:.3rem;margin-bottom:.2rem;flex-wrap:wrap;}
    .tl-card__cat{font-size:.58rem;padding:.08rem .38rem;border-radius:20px;border:1px solid var(--border);opacity:.5;}
    .tl-card__dur{font-size:.58rem;opacity:.35;}
    .tl-card__name{font-family:var(--serif);font-size:.92rem;font-weight:700;line-height:1.35;}
    .tl-card__hours{font-size:.68rem;color:var(--accent2);margin-top:.15rem;}
    .tl-card__note{font-size:.72rem;color:var(--muted);margin-top:.25rem;line-height:1.6;display:none;}
    .tl-card.note-open .tl-card__note{display:block;}
    .tl-card__footer{display:flex;align-items:center;justify-content:space-between;padding:.35rem .8rem .45rem;border-top:1px solid var(--border);margin-top:.3rem;}
    .tl-card__cost{font-size:.7rem;color:var(--accent);font-weight:700;}
    .tl-card__actions{display:flex;gap:.35rem;}
    .tl-card__btn{font-size:.6rem;padding:.2rem .5rem;border:1px solid var(--border);border-radius:20px;opacity:.5;-webkit-tap-highlight-color:transparent;}
    .tl-card__btn:active{opacity:1;border-color:var(--accent);}

    /* 空行程 */
    .empty-day{text-align:center;padding:2.5rem 1rem;opacity:.3;}
    .empty-day__icon{font-size:2.2rem;margin-bottom:.6rem;}
    .empty-day__text{font-size:.82rem;line-height:1.7;}

    /* 手動新增按鈕 */
    .btn-add-item{width:calc(100% - 2rem);margin:.1rem 1rem .6rem;padding:.6rem;border-radius:var(--r);border:1px dashed rgba(255,255,255,.15);color:var(--text);font-size:.8rem;letter-spacing:.08em;opacity:.55;-webkit-tap-highlight-color:transparent;}
    .btn-add-item:active{opacity:1;border-color:var(--accent);}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:500;display:none;align-items:flex-end;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--surface);border-radius:16px 16px 0 0;padding:1.2rem 1.2rem calc(1.2rem + var(--safe-b));width:100%;max-width:600px;max-height:88svh;overflow-y:auto;}
    .modal__title{font-family:var(--serif);font-size:1rem;font-weight:700;margin-bottom:.9rem;}
    .modal-field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.55rem;}
    .modal-field label{font-size:.7rem;opacity:.5;letter-spacing:.08em;}
    .modal-field input,.modal-field select,.modal-field textarea{padding:.5rem .7rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.84rem;outline:none;transition:border-color .2s;width:100%;resize:vertical;}
    .modal-field input:focus,.modal-field select:focus,.modal-field textarea:focus{border-color:var(--accent);}
    .modal-field select option{color:#1A1A1A;background:#FFF;}
    .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;}
    .btn-modal-save{width:100%;padding:.65rem;border-radius:8px;background:var(--accent);color:#fff;font-size:.86rem;letter-spacing:.1em;margin-top:.4rem;}
    .btn-modal-cancel{width:100%;padding:.55rem;border-radius:8px;border:1px solid var(--border);color:var(--text);font-size:.8rem;margin-top:.35rem;opacity:.55;}

    /* Bottom Nav */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;display:flex;background:rgba(13,13,13,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding-bottom:var(--safe-b);}
    [data-theme="light"] .bottom-nav{background:rgba(245,242,238,.97);}
    .bottom-nav__item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:.6rem 0;min-height:44px;opacity:.4;transition:opacity .2s;text-decoration:none;color:var(--text);-webkit-tap-highlight-color:transparent;}
    .bottom-nav__item.active{opacity:1;}
    .bottom-nav__item span:first-child{font-size:1.1rem;line-height:1;}
    .bottom-nav__item span:last-child{font-size:.56rem;letter-spacing:.08em;}

    @media(min-width:768px){
      .timeline,.day-stats,.day-summary,.ai-bar,.wishlist-panel,.region-picker,.btn-add-item{max-width:660px;margin-left:auto;margin-right:auto;}
      body{padding-bottom:0;}
      .bottom-nav{display:none;}
    }
  </style>

<div class="ai-bar">

    <div class="modal__title" id="modal-title">新增行程項目</div>
    <div class="modal-field">
      <label>類型</label>
      <select id="m-type">
        <option value="spot">景點</option>
        <option value="meal">餐廳</option>

        <option value="transit">交通</option>
        <option value="other">其他</option>
      </select>

    <div class="modal-field"><label>名稱 *</label><input id="m-name" type="text" placeholder="景點或店家名稱"></div>
    <div class="modal-grid">
      <div class="modal-field"><label>開始時間</label><input id="m-start" type="time" value="09:00"></div>
      <div class="modal-field"><label>結束時間</label><input id="m-end" type="time" value="10:30"></div>
    </div>
    <div class="modal-grid">
      <div class="modal-field"><label>營業時間</label><input id="m-hours" type="text" placeholder="09:00–17:00"></div>

    <div class="modal-field">
      <label>交通方式到下一站</label>
      <select id="m-transit">
        <option value="">不設定</option>
        <option value="🚗 開車">🚗 開車</option>
        <option value="🚶 步行">🚶 步行</option>
        <option value="🚃 電車">🚃 電車</option>

        <option value="🚢 渡輪">🚢 渡輪</option>
      </select>
    </div>
    <div class="modal-field"><label>交通時間（分鐘）</label><input id="m-transit-min" type="number" placeholder="20" min="0"></div>
    <div class="modal-field"><label>備註</label><textarea id="m-note" rows="2" placeholder="訂位提醒…"></textarea></div>
    <button class="btn-modal-save" id="btn-modal-save">儲存行程</button>
    <button class="btn-modal-cancel" id="btn-modal-cancel">取消</button>
  </div>
</div>

function getIcon(p){
  return SUB_EMOJI[p.subcategory||""] || SUB_EMOJI[p.category||""] ||
    {"景點":"🗺️","餐廳":"🍽️","住宿":"🛎️","購物":"🛒","其他":"📌"}[p.category] || "📌";
}
function typeIcon(t){
  return {spot:"🗺️",meal:"🍽️",stay:"🛎️",transit:"🚗",other:"📌"}[t]||"📌";
}
function dotCls(t){
  return {meal:"tl-dot--meal",stay:"tl-dot--stay",transit:"tl-dot--transit"}[t]||"";
}

// ══════════════════════════════════════════════
//  狀態
// ══════════════════════════════════════════════
let currentDay = 0;
let basePlaces = [];
let customPlaces = [];
let itineraryData = {};   // { date: [{...item,_key}] }
let dayRegions = {};      // { date: "福岡" }  — 每天選的城市
let editingKey = null;

function allPlaces(){ return [...basePlaces,...customPlaces]; }
function getFavs(){ return JSON.parse(localStorage.getItem("kyushu_favs")||"[]"); }
function getDate(){ return TRIP_DAYS[currentDay].date; }
function getDayRegions(){ return dayRegions[getDate()]||[]; }
function getDayRegion(){ const r=getDayRegions(); return r.length?r[0]:""; } // 向後相容

// ══════════════════════════════════════════════
//  日期 Tabs
// ══════════════════════════════════════════════
function buildTabs(){
  const wrap = document.getElementById("date-tabs");
  wrap.innerHTML = "";
  TRIP_DAYS.forEach((d,i)=>{
    const r = dayRegions[d.date]||"";
    const btn = document.createElement("button");
    btn.className = "date-tab"+(i===currentDay?" active":"");
    const regions = dayRegions[d.date]||[];
    const rLabel = regions.length ? regions.join("→") : "未選城市";
    btn.innerHTML = `<span class="date-tab__day">${d.label}</span><span class="date-tab__region">${rLabel}</span>`;
    btn.addEventListener("click",()=>{ currentDay=i; buildTabs(); buildRegionChips(); buildWishlist(); renderDay(); });
    wrap.appendChild(btn);
  });
}

// ══════════════════════════════════════════════
//  城市選擇 Chips
// ══════════════════════════════════════════════
function buildRegionChips(){
  const wrap = document.getElementById("region-chips");
  wrap.innerHTML = "";
  const selected = getDayRegions();
  ALL_REGIONS.forEach(r=>{
    const btn = document.createElement("button");
    const isActive = selected.includes(r);
    btn.className = "region-chip"+(isActive?" active":"");
    btn.textContent = r;
    btn.addEventListener("click",()=>{
      let cur = getDayRegions().slice();
      const idx = cur.indexOf(r);
      if(idx>-1){ cur.splice(idx,1); } else { cur.push(r); }
      dayRegions[getDate()] = cur;
      window.__set(window.__ref(window.__db,"day_regions/"+getDate()),cur.length?cur:null);
      buildTabs(); buildRegionChips(); buildWishlist(); updateAiDesc();
    });
    wrap.appendChild(btn);
  });
}

function updateAiDesc(){
  const rs = getDayRegions();
  const desc = document.getElementById("ai-bar-desc");
  if(!rs.length){ desc.textContent="請先選擇今日城市，AI 才能排程。"; return; }
  if(rs.includes("移動日")){ desc.textContent="包含移動日，AI 會插入城市間交通。"; }
  const cnt = getRegionCandidates().length;
  const label = rs.join(" → ");
  desc.textContent = `城市：${label}｜共 ${cnt} 個心願清單地點，多城市依序排程。`;
}

// ══════════════════════════════════════════════
//  取得當天城市的候選地點（嚴格比對 region）
// ══════════════════════════════════════════════
function getRegionCandidates(){
  const rs = getDayRegions().filter(r=>r!=="移動日");
  if(!rs.length) return [];
  const favs = getFavs();
  return allPlaces().filter(p =>
    rs.includes(p.region) &&
    p.category !== "住宿" &&
    favs.includes(String(p.id))
  );
}

// 取得指定城市的候選（AI 排程用）
function getCityCandidates(r){
  const favs = getFavs();
  return allPlaces().filter(p => p.region===r && p.category!=="住宿" && favs.includes(String(p.id)));
}

function getCityStay(r){
  // 優先最後一個城市的住宿
  return allPlaces().find(p => p.region===r && p.category==="住宿");
}

// ══════════════════════════════════════════════
//  心願清單 Panel
// ══════════════════════════════════════════════
function buildWishlist(){
  const r = getDayRegion();
  const body = document.getElementById("wishlist-body");
  const countEl = document.getElementById("wl-count");

  const rs = getDayRegions().filter(x=>x!=="移動日");
  if(!rs.length){
    body.innerHTML = `<p class="wl-empty">請先選擇今日城市</p>`;
    countEl.textContent = "0"; return;
  }

  const favs = getFavs();
  const regionPlaces = allPlaces().filter(p => rs.includes(p.region) && favs.includes(String(p.id)));
  const r = rs[0]; // 向後相容
  countEl.textContent = regionPlaces.length;

  if(!regionPlaces.length){
    body.innerHTML = `<p class="wl-empty">「${r}」心願清單目前為空，請先在總覽頁加入 ⭐</p>`;
    return;
  }

  // 依類別分組
  const groups = {};
  regionPlaces.forEach(p=>{
    const cat = p.category||"其他";
    if(!groups[cat]) groups[cat]=[];
    groups[cat].push(p);
  });

  const catOrder = ["景點","餐廳","住宿","購物","其他"];
  const date = getDate();
  const added = (itineraryData[date]||[]).map(i=>i.srcId).filter(Boolean);

  body.innerHTML = "";
  catOrder.forEach(cat=>{
    if(!groups[cat]) return;
    const sec = document.createElement("div");
    sec.className = "wl-section";
    const cityLabel = rs.length>1 ? ` (${groups[cat].map(p=>p.region).filter((v,i,a)=>a.indexOf(v)===i).join("/")})` : "";
    sec.innerHTML = `<div class="wl-section__title">${
      {景點:"🗺️ 景點",餐廳:"🍽️ 餐廳",住宿:"🛎️ 住宿",購物:"🛒 購物",其他:"📌 其他"}[cat]||cat
    }${cityLabel}</div>`;
    const chips = document.createElement("div");
    chips.className = "wl-items";
    groups[cat].forEach(p=>{
      const isAdded = added.includes(String(p.id));
      const chip = document.createElement("button");
      chip.className = "wl-chip"+(isAdded?" added":"");
      chip.innerHTML = `<span class="wl-chip__icon">${getIcon(p)}</span><span class="wl-chip__name">${p.name}</span>${p.hours?`<span class="wl-chip__hours">${p.hours}</span>`:""}`;
      chip.title = isAdded?"已加入行程":"點擊快速加入行程";
      chip.addEventListener("click",()=>{ if(!isAdded) quickAddPlace(p); });
      chips.appendChild(chip);
    });
    sec.appendChild(chips);
    body.appendChild(sec);
  });
}

// 快速從心願清單加入行程
function quickAddPlace(p){
  const date = getDate();
  const typeMap = {景點:"spot",餐廳:"meal",住宿:"stay",購物:"other",其他:"other"};
  const type = typeMap[p.category]||"spot";
  const dur = DURATION_MAP[p.subcategory||""]||DURATION_MAP[p.category||""]||60;
  // 算時間：接在最後一個行程後面
  const existing = (itineraryData[date]||[]).filter(i=>i.type!=="transit").sort((a,b)=>(a.start||"").localeCompare(b.start||""));
  let startMin = 9*60;
  if(existing.length){
    const last = existing[existing.length-1];
    if(last.end){
      const [h,m]=last.end.split(":").map(Number);
      startMin = h*60+m+15;
    }
  }
  const start = `${String(Math.floor(startMin/60)).padStart(2,"0")}:${String(startMin%60).padStart(2,"0")}`;
  const endMin = startMin+dur;
  const end = `${String(Math.floor(endMin/60)).padStart(2,"0")}:${String(endMin%60).padStart(2,"0")}`;

  const item = {
    type, name:p.name, start, end,
    hours:p.hours||"", cost:0,
    subcategory:p.subcategory||p.category||"",
    note:p.note||"", srcId:String(p.id),
    transitMode:"🚗 開車", transitMin:15,
    region:p.region,
    createdAt:new Date().toISOString()
  };
  window.__push(window.__ref(window.__db,"itinerary/"+date), item);
}

// ══════════════════════════════════════════════
//  AI 自動排程（嚴格限城市）
// ══════════════════════════════════════════════
function autoScheduleDay(){
  const rs = getDayRegions().filter(r=>r!=="移動日");
  if(!rs.length){ alert("請先選擇今日城市！"); return; }

  const btn = document.getElementById("btn-auto-schedule");
  btn.disabled=true; btn.textContent="⏳ 排程中…";

  let schedule = [];
  let cur = 8*60;

  function fmt(m){ return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`; }

  function pushPlace(p, type, cityR){
    if(cur>=22*60) return;
    const dur = DURATION_MAP[p.subcategory||""]||DURATION_MAP[p.category||""]||60;
    const s=fmt(cur); cur+=dur; const e=fmt(cur);
    schedule.push({
      type, name:p.name, start:s, end:e,
      hours:p.hours||"", cost:0,
      subcategory:p.subcategory||p.category||"",
      note:p.note||"", srcId:String(p.id),
      region:cityR, transitMode:"🚗 開車", transitMin:15,
      createdAt:new Date().toISOString()
    });
    cur+=15;
  }

  function pushTransit(fromCity, toCity){
    if(cur>=22*60) return;
    const s=fmt(cur); cur+=90; // 城市間移動預估90分
    const e=fmt(cur);
    schedule.push({
      type:"transit", name:`${fromCity} → ${toCity}`,
      start:s, end:e, transitMode:"🚗 開車", transitMin:90,
      region:fromCity, cost:0, hours:"", note:"",
      createdAt:new Date().toISOString()
    });
    cur+=0;
  }

  // 每個城市平均分配時間
  const slotPerCity = rs.length===1 ? {spots:4,meals:2} : {spots:2,meals:1};

  rs.forEach((r, ci)=>{
    const cityCands = getCityCandidates(r);
    const spots = cityCands.filter(p=>p.category!=="餐廳");
    const meals = cityCands.filter(p=>p.category==="餐廳");

    if(!cityCands.length){
      // 該城市心願清單空，插入提示
      schedule.push({
        type:"transit", name:`⚠️ ${r} 心願清單為空`,
        start:fmt(cur), end:fmt(cur), transitMode:"", transitMin:0,
        region:r, cost:0, hours:"", note:"",
        createdAt:new Date().toISOString()
      });
      return;
    }

    // 若非第一城市，插入城市轉移交通
    if(ci>0){ pushTransit(rs[ci-1], r); }

    // 上午/前段景點
    spots.slice(0, slotPerCity.spots).forEach(p=>pushPlace(p,"spot",r));
    // 餐廳
    if(meals.length>0){
      if(rs.length===1) cur=Math.max(cur,12*60);
      pushPlace(meals[0],"meal",r);
    }
    // 後段景點（單城市才排）
    if(rs.length===1){
      spots.slice(2,4).forEach(p=>pushPlace(p,"spot",r));
      if(meals.length>1){ cur=Math.max(cur,18*60); pushPlace(meals[1],"meal",r); }
    }
  });

  // 住宿：最後一個城市
  const lastCity = rs[rs.length-1];
  const stay = getCityStay(lastCity);
  if(stay){ cur=Math.max(cur,20*60); pushPlace(stay,"stay",lastCity); }

  const date = getDate();
  window.__remove(window.__ref(window.__db,"itinerary/"+date)).then(()=>{
    schedule.forEach(item=>window.__push(window.__ref(window.__db,"itinerary/"+date),item));
    btn.disabled=false; btn.textContent="🪄 自動排這天";
  });
}

// ══════════════════════════════════════════════
//  Timeline 渲染
// ══════════════════════════════════════════════
function renderDay(){
  const date = getDate();
  const items = (itineraryData[date]||[]).slice().sort((a,b)=>(a.start||"").localeCompare(b.start||""));
  const tl = document.getElementById("timeline");
  tl.innerHTML="";
  updateStats(items);
  updateSummary(items);
  buildWishlist(); // 重新渲染已加入狀態
  updateAiDesc();

  if(!items.length){
    tl.innerHTML=`<div class="empty-day"><div class="empty-day__icon">🗓</div><div class="empty-day__text">這天還沒有行程<br>${getDayRegions().length?`點「🪄 自動排這天」<br>或從心願清單直接點擊加入`:"請先選擇今日城市"}</div></div>`;
    return;
  }

  items.forEach(it=>{
    const row=document.createElement("div");
    row.className="tl-item";
    if(it.type==="transit"){
      row.innerHTML=`<div class="tl-time"></div>
        <div style="position:relative;">
          <div class="tl-dot tl-dot--transit"></div>
          <div class="tl-card tl-card--transit">
            <div class="tl-transit-label">${it.transitMode||"🚗"} ${it.name}${it.cost?` · ¥${Number(it.cost).toLocaleString()}`:""}
            </div>
          </div>
        </div>`;
    } else {
      const [sh,sm]=(it.start||"09:00").split(":");
      row.innerHTML=`
        <div class="tl-time"><div class="tl-time__h">${sh}</div><div class="tl-time__m">${sm||"00"}</div></div>
        <div style="position:relative;">
          <div class="tl-dot ${dotCls(it.type)}"></div>
          <div class="tl-card" data-key="${it._key||""}">
            <div class="tl-card__main">
              <div class="tl-card__meta">
                <span class="tl-card__cat">${getIcon(it)} ${{spot:"景點",meal:"餐廳",stay:"住宿",other:"其他"}[it.type]||it.type}</span>
                ${it.start&&it.end?`<span class="tl-card__dur">${it.start}–${it.end}</span>`:""}
              </div>
              <div class="tl-card__name">${it.name}</div>
              ${it.hours?`<div class="tl-card__hours">🕐 ${it.hours}</div>`:""}
              ${it.note?`<p class="tl-card__note">${it.note}</p>`:""}
            </div>
            <div class="tl-card__footer">
              <span class="tl-card__cost">${it.cost?`¥${Number(it.cost).toLocaleString()}`:""}</span>
              <div class="tl-card__actions">
                ${it.note?`<button class="tl-card__btn btn-note-toggle">備註</button>`:""}
                <a class="tl-card__btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.name+" Japan")}" target="_blank" rel="noopener">🗺</a>
                <button class="tl-card__btn btn-edit" data-key="${it._key||""}">編輯</button>
                <button class="tl-card__btn btn-del" data-key="${it._key||""}" style="color:#ff6b6b;">✕</button>
              </div>
            </div>
          </div>
        </div>`;
    }
    tl.appendChild(row);
  });

  // 備註
  tl.querySelectorAll(".btn-note-toggle").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const c=btn.closest(".tl-card"); c.classList.toggle("note-open");
      btn.textContent=c.classList.contains("note-open")?"收合":"備註";
    });
  });
  // 刪除
  tl.querySelectorAll(".btn-del").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(!confirm("確定刪除？"))return;
      window.__remove(window.__ref(window.__db,"itinerary/"+getDate()+"/"+btn.dataset.key));
    });
  });
  // 編輯
  tl.querySelectorAll(".btn-edit").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const key=btn.dataset.key;
      const item=(itineraryData[getDate()]||[]).find(i=>i._key===key);
      if(!item)return;
      editingKey=key;
      document.getElementById("modal-title").textContent="編輯行程項目";
      document.getElementById("m-type").value=item.type||"spot";
      document.getElementById("m-name").value=item.name||"";
      document.getElementById("m-start").value=item.start||"09:00";
      document.getElementById("m-end").value=item.end||"10:00";
      document.getElementById("m-hours").value=item.hours||"";
      document.getElementById("m-cost").value=item.cost||"";
      document.getElementById("m-transit").value=item.transitMode||"";
      document.getElementById("m-transit-min").value=item.transitMin||"";
      document.getElementById("m-note").value=item.note||"";
      document.getElementById("modal-overlay").classList.add("open");
    });
  });
}

function updateStats(items){
  const spots=items.filter(i=>i.type!=="transit");
  document.getElementById("stat-items").textContent=spots.length;
  let mins=0;
  items.forEach(it=>{
    if(it.start&&it.end){
      const [sh,sm]=it.start.split(":").map(Number);
      const [eh,em]=it.end.split(":").map(Number);
      mins+=(eh*60+em)-(sh*60+sm);
    }
  });
  document.getElementById("stat-hours").textContent=mins>0?`${Math.floor(mins/60)}h${mins%60?mins%60+"m":""}`:"—";
  const cost=items.reduce((s,i)=>s+(parseInt(i.cost)||0),0);
  document.getElementById("stat-cost").textContent=cost>0?`¥${cost.toLocaleString()}`:"—";
}

function updateSummary(items){
  const wrap=document.getElementById("day-summary");
  const spots=items.filter(i=>i.type!=="transit");
  wrap.innerHTML=spots.map(i=>`<span class="summary-pill">${getIcon(i)} ${i.name}</span>`).join("");
}

// ══════════════════════════════════════════════
//  Firebase 初始化
// ══════════════════════════════════════════════
function waitFirebase(cb){ if(window.__firebaseReady){cb();return;} window.addEventListener("firebase-ready",cb,{once:true}); }

waitFirebase(()=>{
  const db=window.__db;

  // 景點資料
  window.__onValue(window.__ref(db,"base_places"),snap=>{
    basePlaces=snap.val()?Object.entries(snap.val()).map(([k,v])=>({...v,_key:k})):[];
    buildWishlist(); updateAiDesc();
  });
  window.__onValue(window.__ref(db,"custom_places"),snap=>{
    customPlaces=snap.val()?Object.entries(snap.val()).map(([k,v])=>({...v,_key:k})):[];
    buildWishlist(); updateAiDesc();
  });

  // 每天城市設定（支援新陣列格式 & 舊字串格式）
  window.__onValue(window.__ref(db,"day_regions"),snap=>{
    const raw=snap.val()||{};
    dayRegions={};
    Object.entries(raw).forEach(([d,v])=>{
      dayRegions[d] = Array.isArray(v)?v:(v?[v]:[]);
    });
    buildTabs(); buildRegionChips(); updateAiDesc();
  });

  // 行程資料
  window.__onValue(window.__ref(db,"itinerary"),snap=>{
    const raw=snap.val()||{};
    itineraryData={};
    Object.entries(raw).forEach(([date,items])=>{
      itineraryData[date]=Object.entries(items).map(([k,v])=>({...v,_key:k}));
    });
    renderDay();
  });

  buildTabs();
  buildRegionChips();
  buildWishlist();
  updateAiDesc();
});
