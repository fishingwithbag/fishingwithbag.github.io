<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>每日行程表 — 九州福岡熊本旅遊 </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0D0D0D; --surface:#141414; --surface2:#1C1C1C;
      --border:rgba(255,255,255,0.09); --text:#E8E8E8; --muted:rgba(232,232,232,0.48);
      --accent:#E8734A; --accent2:#A8C5B0;
      --serif:'Noto Serif JP',serif; --sans:'Noto Sans TC',sans-serif;
      --r:10px; --ease:cubic-bezier(.4,0,.2,1);
      --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    }
    [data-theme="light"] {
      --bg:#F5F2EE; --surface:#FFF; --surface2:#F0EDE9;
      --border:rgba(0,0,0,0.1); --text:#1A1A1A; --muted:rgba(26,26,26,0.55);
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { -webkit-text-size-adjust:100%; }
    body { font-family:var(--sans); background:var(--bg); color:var(--text); overflow-x:hidden; padding-bottom:calc(64px + var(--safe-b)); transition:background .3s, color .3s; }
    a { color:inherit; text-decoration:none; }
    button { font-family:inherit; cursor:pointer; border:none; background:none; }
    input, select, textarea { font-family:inherit; }

    /* Topbar */
    .topbar { position:sticky; top:0; z-index:200; background:rgba(13,13,13,.95); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid var(--border); padding:0 1rem; padding-top:var(--safe-t); display:flex; align-items:center; justify-content:space-between; min-height:52px; gap:.5rem; }
    [data-theme="light"] .topbar { background:rgba(245,242,238,.95); }
    .topbar__left { display:flex; align-items:center; gap:.6rem; }
    .topbar__back { font-size:.8rem; opacity:.55; padding:.4rem; min-height:44px; display:flex; align-items:center; -webkit-tap-highlight-color:transparent; }
    .topbar__title { font-family:var(--serif); font-size:.9rem; letter-spacing:.15em; }
    .icon-btn { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; border:1px solid var(--border); background:var(--surface); color:var(--text); -webkit-tap-highlight-color:transparent; }

    /* Date tabs */
    .date-tabs { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; border-bottom:1px solid var(--border); background:var(--surface); }
    .date-tabs::-webkit-scrollbar { display:none; }
    .date-tab { flex:0 0 auto; scroll-snap-align:start; padding:.75rem 1.1rem; font-size:.78rem; letter-spacing:.08em; white-space:nowrap; opacity:.45; border-bottom:2px solid transparent; transition:opacity .2s, border-color .2s, color .2s; -webkit-tap-highlight-color:transparent; cursor:pointer; min-height:44px; display:flex; flex-direction:column; align-items:center; gap:2px; }
    .date-tab__day { font-family:var(--serif); font-size:1.1rem; font-weight:700; line-height:1; }
    .date-tab__label { font-size:.6rem; letter-spacing:.1em; }
    .date-tab.active { opacity:1; border-bottom-color:var(--accent); color:var(--accent); }
    /* 深色模式：非 active tab 文字提升可讀性 */
    [data-theme="dark"] .date-tab {color: rgba(232, 232, 232, 0.75);}
    [data-theme="dark"] .date-tab.active {color: var(--accent);opacity: 1;}
    /* 淺色模式：非 active tab 文字改用深色 */
    [data-theme="light"] .date-tab {color: rgba(26, 26, 26, 0.65);}
    [data-theme="light"] .date-tab.active {color: var(--accent);opacity: 1;}

    /* Region picker */
    .region-picker { padding:.55rem 1rem; border-bottom:1px solid var(--border); background:var(--surface2); }
    .region-picker__label { font-size:.7rem; opacity:.45; white-space:nowrap; letter-spacing:.08em; }
    .region-picker__trigger { width:100%; min-height:44px; display:flex; align-items:center; gap:.55rem; padding:.45rem .7rem; border:1px solid var(--border); border-radius:8px; color:var(--text); background:var(--surface); text-align:left; }
    .region-picker__chips { display:flex; flex:1; gap:.35rem; flex-wrap:wrap; }
    .region-chip { padding:.18rem .5rem; border:1px solid rgba(232,115,74,.38); border-radius:20px; color:var(--accent); background:rgba(232,115,74,.1); font-size:.68rem; }
    .region-picker__menu { display:none; grid-template-columns:repeat(3,1fr); gap:.4rem; margin-top:.45rem; }
    .region-picker__menu.open { display:grid; }
    .region-option { min-height:40px; padding:.4rem; border:1px solid var(--border); border-radius:7px; color:var(--text); background:var(--surface); font-size:.72rem; }
    .region-option.active { border-color:var(--accent); color:var(--accent); background:rgba(232,115,74,.1); }

    /* Day summary */
    .day-summary { display:flex; gap:.5rem; padding:.65rem 1rem; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border); }
    .day-summary::-webkit-scrollbar { display:none; }
    .summary-pill { flex:0 0 auto; font-size:.68rem; padding:.28rem .7rem; border-radius:20px; border:1px solid var(--border); background:var(--surface2); white-space:nowrap; }

    /* Timeline */
    .timeline { padding:.75rem 1rem 1rem; display:flex; flex-direction:column; gap:0; }
    .tl-item { display:grid; grid-template-columns:56px 1fr; gap:0; position:relative; }
    .tl-item::before { content:''; position:absolute; left:27px; top:32px; bottom:-8px; width:2px; background:var(--border); z-index:0; }
    .tl-item:last-child::before { display:none; }
    .tl-time { padding-top:6px; text-align:right; padding-right:12px; }
    .tl-time__h { font-family:var(--serif); font-size:.88rem; font-weight:700; color:var(--accent); line-height:1; }
    .tl-time__m { font-size:.62rem; opacity:.45; }
    .tl-dot { position:absolute; left:22px; top:8px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); z-index:1; }
    .tl-dot--transit { background:var(--border); }
    .tl-dot--meal { background:#FFD700; }
    .tl-dot--stay { background:var(--accent2); }
    .tl-card { margin-left:20px; margin-bottom:8px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; transition:border-color .2s; }
    .tl-card:active { border-color:var(--accent); }
    .tl-card--transit { background:transparent; border:none; padding:.3rem 0 .3rem .75rem; }
    .tl-card--transit .tl-transit-label { font-size:.72rem; color:var(--muted); display:flex; align-items:center; gap:.4rem; }
    .tl-card__main { padding:.7rem .85rem .5rem; }
    .tl-card__meta { display:flex; align-items:center; gap:.35rem; margin-bottom:.25rem; flex-wrap:wrap; }
    .tl-card__cat { font-size:.6rem; padding:.1rem .42rem; border-radius:20px; border:1px solid var(--border); opacity:.55; }
    .tl-card__dur { font-size:.6rem; opacity:.4; letter-spacing:.06em; }
    .tl-card__name { font-family:var(--serif); font-size:.95rem; font-weight:700; line-height:1.4; }
    .tl-card__hours { font-size:.72rem; color:var(--accent2); margin-top:.2rem; }
    .tl-card__note { font-size:.75rem; color:var(--muted); margin-top:.3rem; line-height:1.65; display:none; }
    .tl-card.note-open .tl-card__note { display:block; }
    .tl-card__footer { display:flex; align-items:center; justify-content:space-between; padding:.4rem .85rem .55rem; border-top:1px solid var(--border); margin-top:.4rem; }
    .tl-card__cost { font-size:.72rem; color:var(--accent); font-weight:700; }
    .tl-card__actions { display:flex; align-items:center; justify-content:flex-end; gap:.4rem; flex-wrap:wrap; }
    .tl-card__btn { font-size:.62rem; padding:.22rem .6rem; border:1px solid var(--border); border-radius:20px; opacity:.55; -webkit-tap-highlight-color:transparent; color:var(--text); background:transparent; }
    .tl-card__btn:active { opacity:1; border-color:var(--accent); }
    .tl-map { width:30px; height:30px; padding:0; display:inline-flex; align-items:center; justify-content:center; border-radius:999px; opacity:1; background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.28); }
    .gmap-icon { width:22px; height:22px; display:block; flex-shrink:0; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
    .gmap-icon__bg,.gmap-icon__center { fill:#fff; }
    .gmap-icon__green { fill:#34A853; }
    .gmap-icon__blue { fill:#4285F4; }
    .gmap-icon__yellow { fill:#FBBC05; }
    .gmap-icon__red { fill:#EA4335; }
    [data-theme="light"] .tl-map { background:#fff; border-color:rgba(0,0,0,.14); box-shadow:0 1px 4px rgba(0,0,0,.12); }

    /* Fav btn — 與 index 一致 */
    .tl-fav { font-size:1rem; line-height:1; color:rgba(120,120,120,.95); background:rgba(255,255,255,.88); border-color:rgba(0,0,0,.14); border-radius:999px; width:30px; height:30px; min-width:30px; display:inline-flex; align-items:center; justify-content:center; border:1px solid rgba(0,0,0,.14); -webkit-tap-highlight-color:transparent; transition:background .16s, border-color .16s, color .16s, box-shadow .16s; }
    .tl-fav.is-fav { color:#ff3f7f; background:rgba(255,63,127,.14); border-color:rgba(255,63,127,.55); text-shadow:0 0 4px rgba(255,63,127,.45), 0 0 8px rgba(255,63,127,.28); box-shadow:0 0 0 1px rgba(255,63,127,.12) inset, 0 0 8px rgba(255,63,127,.22); }
    [data-theme="dark"] .tl-fav { color:rgba(255,255,255,.82); background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.22); }
    [data-theme="dark"] .tl-fav.is-fav { color:#ff6fa3; background:rgba(255,111,163,.16); border-color:rgba(255,111,163,.6); text-shadow:0 0 5px rgba(255,111,163,.6), 0 0 12px rgba(255,111,163,.35); box-shadow:0 0 0 1px rgba(255,111,163,.18) inset, 0 0 12px rgba(255,111,163,.28); }
    [data-theme="light"] .tl-fav { color:rgba(50,50,50,.72); background:#fff; border-color:rgba(0,0,0,.16); }
    [data-theme="light"] .tl-fav.is-fav { color:#e72f75; background:rgba(231,47,117,.1); border-color:rgba(231,47,117,.42); text-shadow:0 0 3px rgba(231,47,117,.35), 0 0 7px rgba(231,47,117,.18); box-shadow:0 1px 4px rgba(0,0,0,.08), 0 0 8px rgba(231,47,117,.16); }
    @keyframes favPulse { 0%{transform:scale(1.5)} 70%{transform:scale(1.28)} 100%{transform:scale(1)} }
    .tl-fav.pulse { animation:favPulse .22s var(--ease); }

    /* Empty */
    .empty-day { text-align:center; padding:3rem 1rem; opacity:.3; }
    .empty-day__icon { font-size:2.5rem; margin-bottom:.75rem; }
    .empty-day__text { font-size:.85rem; letter-spacing:.15em; }

    /* Action toolbar */
    .action-bar { display:grid; grid-template-columns:1fr 1fr; gap:.55rem; padding:.75rem 1rem .35rem; }
    .action-btn { min-height:44px; padding:.55rem .7rem; border:1px solid var(--border); border-radius:8px; color:var(--text); background:var(--surface); font-size:.78rem; }
    .action-btn--primary { border-color:var(--accent); background:var(--accent); color:#fff; }
    .action-btn--flight { grid-column:1/-1; border-color:rgba(168,197,176,.55); color:var(--accent2); background:rgba(168,197,176,.08); }
    .action-btn--clear { grid-column:1/-1; min-height:36px; color:var(--muted); background:transparent; }

    /* Day stats */
    .day-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; padding:.5rem 1rem .25rem; }
    .day-stat { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.6rem .75rem; text-align:center; }
    .day-stat__n { font-family:var(--serif); font-size:1.2rem; font-weight:700; display:block; color:var(--accent); }
    .day-stat__l { font-size:.6rem; opacity:.4; letter-spacing:.1em; display:block; margin-top:.15rem; }

    /* Add button */
    .btn-add-item { width:calc(100% - 2rem); margin:0 1rem .75rem; padding:.65rem; border-radius:var(--r); border:1px dashed rgba(255,255,255,.18); color:var(--text); font-size:.82rem; letter-spacing:.08em; opacity:.6; transition:opacity .2s, border-color .2s; -webkit-tap-highlight-color:transparent; }
    .btn-add-item:active { opacity:1; border-color:var(--accent); }

    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:500; display:none; align-items:flex-end; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--surface); border-radius:16px 16px 0 0; padding:1.25rem 1.25rem calc(1.25rem + var(--safe-b)); width:100%; max-width:600px; max-height:85svh; overflow-y:auto; }
    .modal__title { font-family:var(--serif); font-size:1rem; font-weight:700; margin-bottom:1rem; }
    .modal-field { display:flex; flex-direction:column; gap:.3rem; margin-bottom:.65rem; }
    .modal-field label { font-size:.72rem; opacity:.55; letter-spacing:.08em; }
    .modal-field input, .modal-field select, .modal-field textarea { padding:.55rem .75rem; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:.84rem; outline:none; transition:border-color .2s; width:100%; resize:vertical; }
    [data-theme="light"] .modal-field input,
    [data-theme="light"] .modal-field select,
    [data-theme="light"] .modal-field textarea { color:#1A1A1A; }
    .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus { border-color:var(--accent); }
    .modal-field select option { color:#1A1A1A; background:#FFF; }
    .modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
    .conditional-fields { display:none; }
    .conditional-fields.open { display:block; }
    .flight-presets { display:grid; grid-template-columns:1fr 1fr; gap:.45rem; margin-bottom:.7rem; }
    .flight-preset { min-height:42px; padding:.45rem .6rem; border:1px solid rgba(168,197,176,.42); border-radius:7px; color:var(--accent2); background:rgba(168,197,176,.07); font-size:.72rem; text-align:left; }
    .flight-preset strong { display:block; color:var(--text); font-size:.75rem; }
    .flight-preset span { display:block; margin-top:.12rem; color:var(--muted); font-size:.62rem; }
    .btn-modal-save { width:100%; padding:.7rem; border-radius:8px; background:var(--accent); color:#fff; font-size:.88rem; letter-spacing:.1em; margin-top:.5rem; }
    .btn-modal-cancel { width:100%; padding:.6rem; border-radius:8px; border:1px solid var(--border); color:var(--text); font-size:.82rem; letter-spacing:.08em; margin-top:.4rem; opacity:.6; }

    /* Picker / help */
    .picker-search { width:100%; min-height:44px; padding:.55rem .75rem; border:1px solid var(--border); border-radius:8px; color:var(--text); background:var(--surface2); outline:none; }
    .picker-filters { display:flex; gap:.4rem; overflow-x:auto; padding:.6rem 0; scrollbar-width:none; }
    .picker-filter { flex:0 0 auto; min-height:36px; padding:0 .8rem; border:1px solid var(--border); border-radius:20px; color:var(--muted); }
    .picker-filter.active { border-color:var(--accent); color:var(--accent); }
    .picker-list { border-top:1px solid var(--border); max-height:52svh; overflow-y:auto; }
    .picker-place { width:100%; min-height:62px; display:grid; grid-template-columns:28px 1fr auto; align-items:center; gap:.6rem; padding:.55rem 0; border-bottom:1px solid var(--border); color:var(--text); text-align:left; }
    .picker-place__check { width:24px; height:24px; display:grid; place-items:center; border:1px solid var(--border); border-radius:6px; }
    .picker-place.selected .picker-place__check { border-color:var(--accent); background:var(--accent); color:#fff; }
    .picker-place strong { display:block; font-size:.82rem; }
    .picker-place small { display:block; margin-top:.2rem; color:var(--muted); font-size:.68rem; }
    .picker-place>small { margin:0; }
    .picker-time-grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; padding:.7rem 0; }
    .picker-time-grid label { display:flex; flex-direction:column; gap:.3rem; color:var(--muted); font-size:.7rem; }
    .picker-time-grid input { min-height:44px; padding:.55rem .75rem; border:1px solid var(--border); border-radius:8px; color:var(--text); background:var(--surface2); }
    .tour-overlay { position:fixed; inset:0; z-index:2147483000; display:none; }
    .tour-overlay.open { display:block; }
    .tour-backdrop { position:absolute; inset:0; background:rgba(0,0,0,.76); }
    .tour-target { position:relative !important; z-index:2147483001 !important; border-radius:10px; outline:3px solid var(--accent); outline-offset:4px; }
    .tour-card { position:fixed; z-index:2147483002; display:none; left:.75rem; right:.75rem; bottom:calc(var(--safe-b) + 4.75rem); max-width:420px; max-height:min(32svh,280px); margin:0 auto; padding:.9rem; border:1px solid rgba(232,115,74,.5); border-radius:10px; background:#171717; color:var(--text); overflow-y:auto; overscroll-behavior:contain; box-shadow:0 18px 48px rgba(0,0,0,.55); }
    .tour-card[data-placement="top"] { top:max(.75rem,env(safe-area-inset-top)); bottom:auto; }
    .tour-card[data-placement="bottom"] { top:auto; bottom:calc(var(--safe-b) + 4.75rem); }
    .tour-card.open { display:block; }
    .tour-progress { color:var(--accent); font-size:.68rem; letter-spacing:.08em; }
    .tour-card h2 { margin:.35rem 0; font-family:var(--serif); font-size:1rem; }
    .tour-card p { color:var(--muted); font-size:.78rem; line-height:1.65; }
    .tour-actions { position:sticky; bottom:0; display:grid; grid-template-columns:auto 1fr 1fr; gap:.45rem; margin-top:.75rem; padding-top:.5rem; background:#171717; }
    .tour-actions button { min-height:44px; padding:.55rem .75rem; border:1px solid var(--border); border-radius:8px; color:var(--text); }
    .tour-actions .tour-next { border-color:var(--accent); background:var(--accent); color:#fff; }

    /* Bottom Nav */
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:200; display:flex; background:rgba(13,13,13,.97); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--border); padding-bottom:var(--safe-b); }
    [data-theme="light"] .bottom-nav { background:rgba(245,242,238,.97); }
    .bottom-nav__item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:.6rem 0; min-height:44px; opacity:.4; transition:opacity .2s; text-decoration:none; color:var(--text); -webkit-tap-highlight-color:transparent; }
    .bottom-nav__item.active { opacity:1; }
    .bottom-nav__item span:first-child { font-size:1.15rem; line-height:1; }
    .bottom-nav__item span:last-child { font-size:.58rem; letter-spacing:.08em; }

    @media (min-width:768px) {
      .timeline, .day-stats, .day-summary, .action-bar, .btn-add-item { max-width:640px; margin-left:auto; margin-right:auto; width:calc(100% - 2rem); }
      .action-bar { grid-template-columns:repeat(3,1fr); }
      .action-btn--flight { grid-column:auto; }
      .bottom-nav { display:none; }
      body { padding-bottom:0; }
      .tour-card, .tour-card[data-placement="top"], .tour-card[data-placement="bottom"] { top:1rem; bottom:auto; max-height:calc(100dvh - 2rem); }
    }
    @media (max-width:420px) {
      .modal-grid,.picker-time-grid { grid-template-columns:1fr; }
      .tl-item { grid-template-columns:48px minmax(0,1fr); }
      .tl-card { margin-left:14px; }
      .tl-card__footer { align-items:flex-start; gap:.45rem; }
    }
    [data-theme="light"] .tour-card { background:#fff; color:#1a1a1a; }
    [data-theme="light"] .tour-actions { background:#fff; }
    @media (prefers-reduced-motion:reduce) { .tour-target { scroll-behavior:auto; } }
  </style>
  <script type="module" src="assets/js/firebase-init.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar__left">
    <a href="index.html" class="topbar__back">← 返回</a>
    <span class="topbar__title">行程表</span>
  </div>
  <div style="display:flex;gap:.4rem">
    <button class="icon-btn" id="help-btn" type="button" title="使用說明" aria-label="使用說明">?</button>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="切換主題">🌙</button>
  </div>
</header>

<div class="date-tabs" id="date-tabs"></div>

<div class="region-picker">
  <button class="region-picker__trigger" id="day-region-trigger" type="button" aria-expanded="false">
    <span class="region-picker__label">📍 今日城市</span>
    <span class="region-picker__chips" id="day-region-chips"></span>
    <span aria-hidden="true">⌄</span>
  </button>
  <div class="region-picker__menu" id="day-region-menu"></div>
</div>

<div class="action-bar">
  <button class="action-btn action-btn--primary" id="btn-open-picker" type="button">從景點總覽加入</button>
  <button class="action-btn" id="btn-add-item" type="button">手動新增行程</button>
  <button class="action-btn action-btn--flight" id="btn-add-flight" type="button">加入航班</button>
  <button class="action-btn action-btn--clear" id="btn-clear-day" type="button">清空這天</button>
</div>

<div class="day-stats">
  <div class="day-stat"><span class="day-stat__n" id="stat-items">0</span><span class="day-stat__l">行程數</span></div>
  <div class="day-stat"><span class="day-stat__n" id="stat-hours">—</span><span class="day-stat__l">行程時數</span></div>
  <div class="day-stat"><span class="day-stat__n" id="stat-cost">—</span><span class="day-stat__l">預估費用</span></div>
</div>

<div class="day-summary" id="day-summary"></div>
<div class="timeline" id="timeline"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal__title" id="modal-title">新增行程項目</div>
    <div class="modal-field">
      <label>類型</label>
      <select id="m-type">
        <option value="spot">🏛 景點</option>
        <option value="meal">🍜 餐廳</option>
        <option value="stay">🏨 住宿</option>
        <option value="transit">🚗 交通</option>
        <option value="commute">🚕 通勤／機場接送</option>
        <option value="flight">✈️ 飛機航班</option>
        <option value="other">📌 其他</option>
      </select>
    </div>
    <div class="modal-field">
      <label>城市</label>
      <select id="m-city"></select>
    </div>
    <div class="modal-field">
      <label>名稱 *</label>
      <input id="m-name" type="text" list="place-suggestions" placeholder="景點或店家名稱">
      <datalist id="place-suggestions"></datalist>
    </div>
    <div class="modal-grid">
      <div class="modal-field">
        <label>開始時間 *</label>
        <input id="m-start" type="time" required>
      </div>
      <div class="modal-field">
        <label>結束時間 *</label>
        <input id="m-end" type="time" required>
      </div>
    </div>
    <div class="conditional-fields" id="flight-fields">
      <div class="flight-presets" aria-label="航班快速帶入">
        <button class="flight-preset" type="button" data-flight-preset="JX846"><strong>JX846 去程</strong><span>9/30 TPE 07:30 → KMJ 10:45</span></button>
        <button class="flight-preset" type="button" data-flight-preset="JX847"><strong>JX847 回程</strong><span>10/7 KMJ 11:55 → TPE 13:20</span></button>
      </div>
      <div class="modal-grid">
        <div class="modal-field"><label>航班編號</label><input id="m-flight-no" type="text" placeholder="例：JX840"></div>
        <div class="modal-field"><label>飛行時間</label><input id="m-flight-duration" type="text" inputmode="numeric" placeholder="例：2:20"></div>
      </div>
      <div class="modal-grid">
        <div class="modal-field"><label>出發機場</label><input id="m-origin" type="text" placeholder="TPE 桃園"></div>
        <div class="modal-field"><label>抵達機場</label><input id="m-destination" type="text" placeholder="FUK 福岡"></div>
      </div>
    </div>
    <div class="modal-grid">
      <div class="modal-field">
        <label>營業時間</label>
        <input id="m-hours" type="text" placeholder="例：09:00–17:00">
      </div>
      <div class="modal-field">
        <label>預估費用 (¥)</label>
        <input id="m-cost" type="number" placeholder="0" min="0">
      </div>
    </div>
    <div class="modal-field">
      <label>交通方式到下一站</label>
      <select id="m-transit">
        <option value="">不設定</option>
        <option value="🚗 開車">🚗 開車</option>
        <option value="🚶 步行">🚶 步行</option>
        <option value="🚃 電車">🚃 電車</option>
        <option value="🚌 巴士">🚌 巴士</option>
        <option value="🚢 渡輪">🚢 渡輪</option>
      </select>
    </div>
    <div class="modal-field">
      <label>交通時間（分鐘）</label>
      <input id="m-transit-min" type="number" placeholder="例：20" min="0">
    </div>
    <div class="modal-field">
      <label>備註</label>
      <textarea id="m-note" rows="2" placeholder="訂位提醒、注意事項…"></textarea>
    </div>
    <button class="btn-modal-save" id="btn-modal-save">儲存行程</button>
    <button class="btn-modal-cancel" id="btn-modal-cancel">取消</button>
  </div>
</div>

<div class="modal-overlay" id="picker-overlay" role="dialog" aria-modal="true" aria-labelledby="picker-title">
  <div class="modal">
    <div style="display:flex;align-items:center;justify-content:space-between"><div class="modal__title" id="picker-title">從景點總覽加入</div><button class="icon-btn" data-close-modal="picker-overlay" type="button" aria-label="關閉">×</button></div>
    <input class="picker-search" id="picker-search" type="search" placeholder="搜尋景點、餐廳或城市">
    <div class="picker-filters" id="picker-filters"></div>
    <div class="picker-list" id="picker-list"></div>
    <div class="picker-time-grid">
      <label>第一個景點開始時間 *<input id="picker-start" type="time" required></label>
      <label>景點間移動緩衝（分鐘）<input id="picker-gap" type="number" min="0" step="5" value="30"></label>
    </div>
    <button class="btn-modal-save" id="btn-add-selected" type="button">加入 0 個行程</button>
    <button class="btn-modal-cancel" data-close-modal="picker-overlay" type="button">取消</button>
  </div>
</div>

<div class="tour-overlay" id="help-overlay" aria-hidden="true"><div class="tour-backdrop"></div></div>
  <section class="tour-card" id="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title">

    <p id="tour-body"></p>
    <div class="tour-actions">
      <button id="tour-close" type="button">略過</button>
      <button id="tour-prev" type="button">上一步</button>
      <button class="tour-next" id="tour-next" type="button">下一步</button>
    </div>
  </section>

<script>
const FAVICONOFF = '❤️';
const FAVICONON  = '💖';

const TRIP_DAYS = [
  {date:'2026-09-30', label:'9/30',  sub:'別府', region:'別府'},
  {date:'2026-10-01', label:'10/1',  sub:'大分', region:'大分'},
  {date:'2026-10-02', label:'10/2',  sub:'熊本', region:'熊本'},
  {date:'2026-10-03', label:'10/3',  sub:'移動', region:''},
  {date:'2026-10-04', label:'10/4',  sub:'福岡', region:'福岡'},
  {date:'2026-10-05', label:'10/5',  sub:'福岡', region:'福岡'},
  {date:'2026-10-06', label:'10/6',  sub:'福岡', region:'福岡'},
  {date:'2026-10-07', label:'10/7',  sub:'回台', region:''},
];

const DURATION_DEFAULT = {
  '景點':90,'神社':45,'公園':45,'市場':60,'博物館':120,'動物園':180,
  '餐廳':60,'拉麵店':40,'燒肉店':90,'壽司':90,'甜點':30,
  '住宿':0,'釣點':240,'釣具店':30,'購物':60,'其他':30
};

const ALL_REGIONS = ['別府','大分','熊本','阿蘇','福岡','北九州','長崎','佐賀','移動日'];

let currentDay   = 0;
let allBasePlaces   = [];
let allCustomPlaces = [];
let itineraryData   = {};
let dayRegionMap    = {};
let favsCache       = [];
let editingKey      = null;
let selectedPlaceIds = new Set();
let pickerRegion = '全部';

function allPlaces() { return [...allBasePlaces, ...allCustomPlaces]; }
function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function normalizeRegionName(v) {
  return String(v || '').trim().replace(/\s+/g, '').replace(/[縣県市]$/u, '');
}
function regionMatches(a, b) {
  const aa = normalizeRegionName(a);
  const bb = normalizeRegionName(b);
  if (!aa || !bb) return aa === bb;
  return aa === bb;
}
function getPlaceFavKey(place) {
  if (!place || typeof place !== 'object') return '';
  if (place.id !== undefined && place.id !== null && String(place.id).trim()) return String(place.id);
  if (place.placeId !== undefined && place.placeId !== null && String(place.placeId).trim()) return String(place.placeId);
  if (place._key !== undefined && place._key !== null && String(place._key).trim()) return String(place._key);
  return '';
}
// ── Theme（與 index 一致，持久化）──
(function initTheme() {
  const t = localStorage.getItem('kyushu_theme') || 'dark';
  document.documentElement.dataset.theme = t;
  document.getElementById('theme-btn').textContent = t === 'dark' ? '🌙' : '☀️';
})();

document.getElementById('theme-btn').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.getElementById('theme-btn').textContent = t === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('kyushu_theme', t);
});

// ── Fav helpers（Firebase Realtime DB，與 index 一致）──
function waitFirebaseReady() {
  if (window.__firebaseReady) return Promise.resolve();
  return new Promise(resolve => window.addEventListener('firebase-ready', resolve, { once: true }));
}

async function toggleFav(id) {
  await waitFirebaseReady();
  const key = String(id);
  const exists = favsCache.includes(key);
  const favRef = window.__ref(window.__db, `favs/${key}`);
  if (exists) {
    await window.__remove(favRef);
    return FAVICONOFF;
  }
  await window.__set(favRef, true);
  return FAVICONON;
}

// ── Region / Day helpers ──
function getDayRegions(date) {
  const target = date || TRIP_DAYS[currentDay].date;
  const stored = Object.prototype.hasOwnProperty.call(dayRegionMap, target)
    ? dayRegionMap[target]
    : TRIP_DAYS.find(x => x.date === target)?.region;
  if (Array.isArray(stored)) return stored.filter(Boolean);
  return stored ? [stored] : [];
}

function getDayRegion(date) { return getDayRegions(date)[0] || ''; }

function buildDayRegionSelect() {
  const current = getDayRegions();
  document.getElementById('day-region-chips').innerHTML = current.length
    ? current.map(r => `<span class="region-chip">${escapeHTML(r)}</span>`).join('')
    : '<span class="region-chip">尚未設定</span>';
  document.getElementById('day-region-menu').innerHTML = ALL_REGIONS.map(r =>
    `<button class="region-option${current.includes(r) ? ' active' : ''}" type="button" data-region="${escapeHTML(r)}">${current.includes(r) ? '✓ ' : ''}${escapeHTML(r)}</button>`
  ).join('');
  const cityOptions = current.length ? current : ALL_REGIONS;
  document.getElementById('m-city').innerHTML = cityOptions.map(r => `<option value="${escapeHTML(r)}">${escapeHTML(r)}</option>`).join('');
}

// ── Tabs ──
function buildTabs() {
  const wrap = document.getElementById('date-tabs');
  wrap.innerHTML = '';
  TRIP_DAYS.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'date-tab' + (i === currentDay ? ' active' : '');
    const regions = getDayRegions(d.date);
    const label = regions.length > 1 ? `${regions[0]} +${regions.length - 1}` : regions[0] || d.sub;
    btn.innerHTML = `<span class="date-tab__day">${d.label}</span><span class="date-tab__label">${escapeHTML(label)}</span>`;
    btn.addEventListener('click', () => { currentDay = i; buildTabs(); buildDayRegionSelect(); renderDay(); });
    wrap.appendChild(btn);
  });
}

// ── Stats & Summary ──
function updateStats(items) {
  const spots = items.filter(it => it.type !== 'transit');
  document.getElementById('stat-items').textContent = spots.length;
  let mins = 0;
  items.forEach(it => {
    if (it.durationMin) { mins += Number(it.durationMin) || 0; return; }
    if (it.start && it.end) {
      const [sh, sm] = it.start.split(':').map(Number);
      const [eh, em] = it.end.split(':').map(Number);
      mins += (eh * 60 + em) - (sh * 60 + sm);
    }
  });
  document.getElementById('stat-hours').textContent = mins > 0 ? `${Math.floor(mins / 60)}h${mins % 60 ? mins % 60 + 'm' : ''}` : '—';
  const cost = items.reduce((s, it) => s + (parseInt(it.cost) || 0), 0);
  document.getElementById('stat-cost').textContent = cost > 0 ? `¥${cost.toLocaleString()}` : '—';
}

function updateSummary(items) {
  const wrap = document.getElementById('day-summary');
  const spots = items.filter(it => it.type !== 'transit');
  wrap.innerHTML = spots.map(it => `<span class="summary-pill">${typeEmoji(it.type)} ${it.name}</span>`).join('');
}

function typeEmoji(t) { return {spot:'🏛',meal:'🍜',stay:'🏨',transit:'🚗',commute:'🚕',flight:'✈️',other:'📌'}[t] || '📌'; }
function typeLabel(t) { return {spot:'景點',meal:'餐廳',stay:'住宿',transit:'交通',commute:'通勤',flight:'航班',other:'其他'}[t] || '其他'; }
function dotClass(t)  { return {meal:'tl-dot--meal',stay:'tl-dot--stay',transit:'tl-dot--transit'}[t] || ''; }
function timeToMinutes(value) {
  const match = String(value || '').match(/^(?:[01]?\d|2[0-3]):[0-5]\d$/);
  if (!match) return Number.MAX_SAFE_INTEGER;
  const [hours, minutes] = match[0].split(':').map(Number);
  return hours * 60 + minutes;
}
function normalizeTimeValue(value) {
  const minutes = timeToMinutes(value);
  if (!Number.isFinite(minutes) || minutes === Number.MAX_SAFE_INTEGER) return '';
  return `${String(Math.floor(minutes / 60)).padStart(2,'0')}:${String(minutes % 60).padStart(2,'0')}`;
}
function compareItineraryTime(a, b) {
  const difference = timeToMinutes(a.start) - timeToMinutes(b.start);
  if (difference) return difference;
  return String(a.createdAt || '').localeCompare(String(b.createdAt || '')) || String(a._key || '').localeCompare(String(b._key || ''));
}

// ── Render Timeline ──
function renderDay() {
  const date  = TRIP_DAYS[currentDay].date;
  const items = (itineraryData[date] || []).slice().sort(compareItineraryTime);
  const tl    = document.getElementById('timeline');
  tl.innerHTML = '';
  updateStats(items);
  updateSummary(items);

  if (!items.length) {
    tl.innerHTML = `<div class="empty-day"><div class="empty-day__icon">🗓</div><div class="empty-day__text">這天還沒有行程<br>可從景點總覽挑選或手動新增</div></div>`;
    return;
  }

  items.forEach((it, idx) => {
    const row = document.createElement('div');
    row.className = 'tl-item';

    const [sh, sm] = (it.start || '09:00').split(':');
    row.dataset.key = it._key || idx;
    row.innerHTML = `
        <div class="tl-time">
          <div class="tl-time__h">${sh}</div>
          <div class="tl-time__m">${sm || '00'}</div>
        </div>
        <div style="position:relative">
          <div class="tl-dot ${dotClass(it.type)}"></div>
          <div class="tl-card" data-key="${it._key || idx}">
            <div class="tl-card__main">
              <div class="tl-card__meta">
                <span class="tl-card__cat">${typeEmoji(it.type)} ${typeLabel(it.type)}</span>
                ${it.flightNo ? `<span class="tl-card__cat">${escapeHTML(it.flightNo)}</span>` : ''}
                ${it.city ? `<span class="tl-card__cat">${escapeHTML(it.city)}</span>` : ''}
                ${it.start && it.end ? `<span class="tl-card__dur">${it.start}–${it.end}</span>` : ''}
              </div>
              <div class="tl-card__name">${escapeHTML(it.name)}</div>
              ${it.type === 'flight' && (it.origin || it.destination) ? `<div class="tl-card__hours">${escapeHTML(it.origin || '')} → ${escapeHTML(it.destination || '')}${it.durationMin ? ` · ${Math.floor(it.durationMin / 60)}h${it.durationMin % 60 ? it.durationMin % 60 + 'm' : ''}` : ''}</div>` : ''}
              ${it.hours ? `<div class="tl-card__hours">🕐 營業：${escapeHTML(it.hours)}</div>` : ''}
              ${it.note  ? `<p class="tl-card__note">${escapeHTML(it.note)}</p>` : ''}
            </div>
            <div class="tl-card__footer">
              <span class="tl-card__cost">${it.cost ? `¥${Number(it.cost).toLocaleString()}` : ''}</span>
              <div class="tl-card__actions">
                ${it.note ? `<button class="tl-card__btn btn-note-toggle">備註</button>` : ''}
                <a class="tl-card__btn tl-map" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.name + ' Japan')}" target="_blank" rel="noopener" title="開啟 Google Maps" aria-label="開啟 Google Maps">
                  <svg class="gmap-icon" viewBox="0 0 36 36" aria-hidden="true">
                    <circle class="gmap-icon__bg" cx="18" cy="18" r="16"/>
                    <path class="gmap-icon__green" d="M18 6.2c-5.05 0-9.15 4.05-9.15 9.05 0 6.8 9.15 14.55 9.15 14.55V19.1l-3.75-3.75L18 6.2z"/>
                    <path class="gmap-icon__blue" d="M18 29.8s9.15-7.75 9.15-14.55c0-2.45-.98-4.67-2.57-6.3L18 15.5v14.3z"/>
                    <path class="gmap-icon__yellow" d="M8.85 15.25c0 2.8 1.55 5.95 3.38 8.6L18 18.1v-2.6l-5.95-5.95a8.95 8.95 0 0 0-3.2 5.7z"/>
                    <path class="gmap-icon__red" d="M24.58 8.95A9.08 9.08 0 0 0 18 6.2a9.02 9.02 0 0 0-5.95 2.25L18 14.4l6.58-5.45z"/>
                    <circle class="gmap-icon__center" cx="18" cy="15.35" r="3.15"/>
                  </svg>
                </a>
                <button class="tl-card__btn btn-edit" data-key="${it._key || idx}">編輯</button>
                <button class="tl-card__btn btn-del" data-key="${it._key || idx}" style="color:#ff6b6b">刪除</button>
              </div>
            </div>
          </div>
        </div>`;
    tl.appendChild(row);
  });

  tl.querySelectorAll('.btn-note-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.tl-card');
      const open = card.classList.toggle('note-open');
      btn.textContent = open ? '收合' : '備註';
    });
  });

  tl.querySelectorAll('.btn-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const key  = btn.dataset.key;
      const date = TRIP_DAYS[currentDay].date;
      window.__remove(window.__ref(window.__db, `itinerary/${date}/${key}`));
    });
  });

  tl.querySelectorAll('.btn-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const key  = btn.dataset.key;
      const date = TRIP_DAYS[currentDay].date;
      const item = (itineraryData[date] || []).find(i => i._key === key);
      if (!item) return;
      buildPlaceSuggestions();
      setupTimeInput('m-start');
      setupTimeInput('m-end');
      editingKey = key;
      document.getElementById('m-type').value         = item.type || 'spot';
      document.getElementById('m-name').value         = item.name || '';
      document.getElementById('m-start').value        = normalizeTimeValue(item.start) || '09:00';
      document.getElementById('m-end').value          = normalizeTimeValue(item.end) || '10:00';
      document.getElementById('m-hours').value        = item.hours || '';
      document.getElementById('m-cost').value         = item.cost  || '';
      document.getElementById('m-transit').value      = item.transitMode || '';
      document.getElementById('m-transit-min').value  = item.transitMin  || '';
      document.getElementById('m-note').value         = item.note  || '';
      if (item.city && ![...document.getElementById('m-city').options].some(o => o.value === item.city)) {
        document.getElementById('m-city').add(new Option(item.city, item.city));
      }
      document.getElementById('m-city').value = item.city || getDayRegion();
      document.getElementById('m-flight-no').value = item.flightNo || '';
      document.getElementById('m-flight-duration').value = item.durationMin ? `${Math.floor(item.durationMin / 60)}:${String(item.durationMin % 60).padStart(2, '0')}` : '';
      document.getElementById('m-origin').value = item.origin || '';
      document.getElementById('m-destination').value = item.destination || '';
      document.getElementById('modal-title').textContent = '編輯行程項目';
      toggleFlightFields();
      document.getElementById('modal-overlay').classList.add('open');
    });
  });

}

// ── Helpers: normalize / autofill ──
function normalizeName(s) { return (s || '').trim().toLowerCase(); }

function guessItemType(place) {
  if (!place) return 'spot';
  if (place.category === '餐廳') return 'meal';
  if (place.category === '住宿') return 'stay';
  if (place.category === '其他') return 'other';
  return 'spot';
}

function getPlaceDuration(place) {
  return DURATION_DEFAULT[place?.subcategory] || DURATION_DEFAULT[place?.category] || 60;
}

function setEndByStartAndPlace() {
  const name  = document.getElementById('m-name')?.value || '';
  const start = document.getElementById('m-start')?.value || '';
  if (!start || !/^([01]?\d|2[0-3]):[0-5]\d$/.test(start)) return;
  const place  = allPlaces().find(p => normalizeName(p.name) === normalizeName(name));
  const dur    = getPlaceDuration(place);
  const [h, m] = start.split(':').map(Number);
  const endMin = h * 60 + m + dur;
  document.getElementById('m-end').value =
    `${String(Math.floor(endMin / 60) % 24).padStart(2,'0')}:${String(endMin % 60).padStart(2,'0')}`;
}

function buildPlaceSuggestions() {
  const dl  = document.getElementById('place-suggestions');
  if (!dl) return;
  const map = new Map();
  allPlaces().forEach(p => { if (p.name && !map.has(p.name)) map.set(p.name, p); });
  dl.innerHTML = [...map.keys()].sort((a, b) => a.localeCompare(b, 'zh-Hant'))
    .map(n => `<option value="${n.replace(/"/g,'&quot;')}"></option>`).join('');
}

function autofillPlaceFields() {
  const name    = document.getElementById('m-name')?.value || '';
  const target  = normalizeName(name);
  if (!target) return;
  const region  = getDayRegion();
  const matches = allPlaces().filter(p => normalizeName(p.name) === target);
  if (!matches.length) return;
  const first   = matches.find(p => region && regionMatches(p.region, region)) || matches[0];
  if (!first) return;
  document.getElementById('m-type').value = guessItemType(first);
  if (!document.getElementById('m-hours').value.trim() && first.hours) document.getElementById('m-hours').value = first.hours;
  if (!document.getElementById('m-note').value.trim()  && first.note)  document.getElementById('m-note').value  = first.note;
  if (!document.getElementById('m-cost').value && first.cost) document.getElementById('m-cost').value = parseInt(first.cost) || 0;
  setEndByStartAndPlace();
}

function setupTimeInput(id) {
  const el = document.getElementById(id);
  if (!el || el.dataset.timeReady) return;
  el.dataset.timeReady = '1';
  el.addEventListener('input', e => {
    let v = e.target.value.replace(/[^0-9]/g, '');
    if (v.length >= 3) v = v.slice(0, 2) + ':' + v.slice(2, 4);
    e.target.value = v;
  });
  el.addEventListener('blur', e => {
    e.target.style.borderColor = /^([01]?\d|2[0-3]):[0-5]\d$/.test(e.target.value) ? '' : '#ff6b6b';
  });
}

function toggleFlightFields() {
  const isFlight = document.getElementById('m-type').value === 'flight';
  document.getElementById('flight-fields').classList.toggle('open', isFlight);
  if (isFlight && !document.getElementById('m-name').value.trim()) document.getElementById('m-name').value = '飛機航班';
}

const FLIGHT_PRESETS = {
  JX846: {
    date:'2026-09-30', name:'星宇航空 JX846', start:'07:30', end:'10:45', duration:'2:15',
    origin:'TPE 桃園國際機場 T1', destination:'KMJ 熊本機場',
    note:'05:00 機場櫃檯開放，06:30 報到截止；登機門請於當日查看 STARLUX App 或機場看板。'
  },
  JX847: {
    date:'2026-10-07', name:'星宇航空 JX847', start:'11:55', end:'13:20', duration:'2:25',
    origin:'KMJ 熊本機場', destination:'TPE 桃園國際機場 T1',
    note:'09:25 機場櫃檯開放，10:55 報到截止並抵達登機門；登機門請於當日查看 STARLUX App 或機場看板。'
  }
};

function applyFlightPreset(flightNo) {
  const flight = FLIGHT_PRESETS[flightNo];
  if (!flight) return;
  const dayIndex = TRIP_DAYS.findIndex(day => day.date === flight.date);
  if (dayIndex >= 0 && dayIndex !== currentDay) {
    currentDay = dayIndex;
    buildTabs();
    buildDayRegionSelect();
  }
  const citySelect = document.getElementById('m-city');
  if (![...citySelect.options].some(option => option.value === '移動日')) citySelect.add(new Option('移動日', '移動日'));
  document.getElementById('m-type').value = 'flight';
  document.getElementById('m-name').value = flight.name;
  document.getElementById('m-city').value = '移動日';
  document.getElementById('m-start').value = flight.start;
  document.getElementById('m-end').value = flight.end;
  document.getElementById('m-flight-no').value = flightNo;
  document.getElementById('m-flight-duration').value = flight.duration;
  document.getElementById('m-origin').value = flight.origin;
  document.getElementById('m-destination').value = flight.destination;
  document.getElementById('m-note').value = flight.note;
  document.getElementById('modal-title').textContent = `加入航班 ${flightNo}`;
  toggleFlightFields();
}

function parseDuration(value) {
  const [hours, minutes] = String(value || '').split(':').map(Number);
  return Number.isFinite(hours) && Number.isFinite(minutes) ? hours * 60 + minutes : 0;
}

function renderPickerFilters() {
  const regions = ['全部', ...new Set(getDayRegions())];
  if (!regions.includes(pickerRegion)) pickerRegion = '全部';
  document.getElementById('picker-filters').innerHTML = regions.map(region =>
    `<button class="picker-filter${pickerRegion === region ? ' active' : ''}" type="button" data-picker-region="${escapeHTML(region)}">${escapeHTML(region)}</button>`
  ).join('');
}

function renderPlacePicker() {
  const query = document.getElementById('picker-search').value.trim().toLowerCase();
  const dayRegions = getDayRegions();
  const places = allPlaces().filter(place => {
    const region = String(place.region || '');
    const matchesDay = !dayRegions.length || dayRegions.some(dayRegion => regionMatches(region, dayRegion));
    const matchesFilter = pickerRegion === '全部' || regionMatches(region, pickerRegion);
    const haystack = `${place.name || ''} ${region} ${place.category || ''} ${place.note || ''}`.toLowerCase();
    return matchesDay && matchesFilter && (!query || haystack.includes(query));
  });
  document.getElementById('picker-list').innerHTML = places.length ? places.map(place => {
    const id = getPlaceFavKey(place);
    const selected = selectedPlaceIds.has(id);
    return `<button class="picker-place${selected ? ' selected' : ''}" type="button" data-place-id="${escapeHTML(id)}"><span class="picker-place__check">${selected ? '✓' : ''}</span><span><strong>${escapeHTML(place.name)}</strong><small>${escapeHTML(place.category || '景點')}${place.note ? ` · ${escapeHTML(place.note)}` : ''}</small></span><small>${escapeHTML(place.region || '')}</small></button>`;
  }).join('') : '<div class="empty-day"><div class="empty-day__text">目前條件沒有可加入的地點</div></div>';
  document.getElementById('btn-add-selected').textContent = `加入 ${selectedPlaceIds.size} 個行程`;
}

async function addSelectedPlaces() {
  if (!selectedPlaceIds.size) return;
  const pickerStart = document.getElementById('picker-start').value;
  if (!pickerStart) { alert('請先填寫第一個景點的開始時間'); return; }
  await waitFirebaseReady();
  const date = TRIP_DAYS[currentDay].date;
  let startMinutes = timeToMinutes(pickerStart);
  const gapMinutes = Math.max(0, parseInt(document.getElementById('picker-gap').value) || 0);
  const selected = allPlaces().filter(place => selectedPlaceIds.has(getPlaceFavKey(place)));
  for (const place of selected) {
    const duration = getPlaceDuration(place);
    const start = `${String(Math.floor(startMinutes / 60) % 24).padStart(2, '0')}:${String(startMinutes % 60).padStart(2, '0')}`;
    startMinutes += duration;
    const end = `${String(Math.floor(startMinutes / 60) % 24).padStart(2, '0')}:${String(startMinutes % 60).padStart(2, '0')}`;
    await window.__push(window.__ref(window.__db, `itinerary/${date}`), {
      type: guessItemType(place), name: place.name || '', city: place.region || '', start, end,
      hours: place.hours || '', cost: parseInt(place.cost) || 0, note: place.note || '',
      region: place.region || '', category: place.category || '', subcategory: place.subcategory || '',
      placeId: getPlaceFavKey(place), createdAt: new Date().toISOString()
    });
    startMinutes += gapMinutes;
  }
  document.getElementById('picker-overlay').classList.remove('open');
  selectedPlaceIds.clear();
}

// ── Modal ──
function openNewItemModal(type = 'spot') {
  buildPlaceSuggestions();
  buildDayRegionSelect();
  setupTimeInput('m-start');
  setupTimeInput('m-end');
  editingKey = null;
  ['m-name','m-hours','m-cost','m-transit-min','m-note','m-flight-no','m-flight-duration','m-origin','m-destination'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('m-type').value  = type;
  document.getElementById('m-start').value = '';
  document.getElementById('m-end').value   = '';
  document.getElementById('modal-title').textContent = type === 'flight' ? '加入航班' : '新增行程項目';
  toggleFlightFields();
  document.getElementById('modal-overlay').classList.add('open');
}

document.getElementById('btn-add-item').addEventListener('click', () => openNewItemModal());
document.getElementById('btn-add-flight').addEventListener('click', () => openNewItemModal('flight'));
document.querySelectorAll('[data-flight-preset]').forEach(button => button.addEventListener('click', () => applyFlightPreset(button.dataset.flightPreset)));
const requestedFlight = new URLSearchParams(location.search).get('flight');
if (FLIGHT_PRESETS[requestedFlight]) {
  openNewItemModal('flight');
  applyFlightPreset(requestedFlight);
  history.replaceState(null, '', location.pathname);
}

document.getElementById('btn-modal-cancel').addEventListener('click', () => document.getElementById('modal-overlay').classList.remove('open'));
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === document.getElementById('modal-overlay')) document.getElementById('modal-overlay').classList.remove('open'); });

document.getElementById('btn-modal-save').addEventListener('click', async () => {
  const name     = document.getElementById('m-name').value.trim();
  if (!name) { alert('請填寫名稱'); return; }
  const startVal = document.getElementById('m-start').value.trim();
  const endVal   = document.getElementById('m-end').value.trim();
  if (!/^([01]?\d|2[0-3]):[0-5]\d$/.test(startVal) || !/^([01]?\d|2[0-3]):[0-5]\d$/.test(endVal)) { alert('請輸入正確的 24 小時制時間，例如 09:00'); return; }
  if (endVal <= startVal && document.getElementById('m-type').value !== 'flight') { alert('結束時間需晚於開始時間'); return; }

  const date          = TRIP_DAYS[currentDay].date;
  const region        = document.getElementById('m-city').value || getDayRegion(date);
  const matchedPlaces = allPlaces().filter(p => normalizeName(p.name) === normalizeName(name));
  const matchedPlace  = matchedPlaces.find(p => region && regionMatches(p.region, region)) || matchedPlaces[0] || null;
  const selectedType  = document.getElementById('m-type').value;
  const durationMin   = selectedType === 'flight' ? parseDuration(document.getElementById('m-flight-duration').value) : 0;
  const existingItem  = editingKey ? (itineraryData[date] || []).find(existing => existing._key === editingKey) : null;

  const item = {
    type:        selectedType === 'flight' || selectedType === 'commute' ? selectedType : matchedPlace ? guessItemType(matchedPlace) : selectedType,
    name, start: startVal, end: endVal,
    city:         region,
    hours:       document.getElementById('m-hours').value.trim() || matchedPlace?.hours || '',
    cost:        parseInt(document.getElementById('m-cost').value) || parseInt(matchedPlace?.cost) || 0,
    transitMode: document.getElementById('m-transit').value,
    transitMin:  parseInt(document.getElementById('m-transit-min').value) || 0,
    note:        document.getElementById('m-note').value.trim() || matchedPlace?.note || '',
    region:      matchedPlace?.region || region || '',
    category:    matchedPlace?.category || '',
    subcategory: matchedPlace?.subcategory || '',
    placeId:     matchedPlace ? getPlaceFavKey(matchedPlace) : '',
    durationMin: durationMin || 0,
    flightNo:    document.getElementById('m-flight-no').value.trim(),
    origin:      document.getElementById('m-origin').value.trim(),
    destination: document.getElementById('m-destination').value.trim(),
    createdAt:   existingItem?.createdAt || new Date().toISOString()
  };

  try {
    await waitFirebaseReady();
    if (editingKey) {
      await window.__set(window.__ref(window.__db, `itinerary/${date}/${editingKey}`), item);
    } else {
      await window.__push(window.__ref(window.__db, `itinerary/${date}`), item);
    }
    document.getElementById('modal-overlay').classList.remove('open');
    editingKey = null;
  } catch (error) {
    console.error('行程儲存失敗：', error);
    alert('行程儲存失敗，請確認 Firebase 登入與寫入權限。');
  }
});

document.getElementById('btn-clear-day').addEventListener('click', () => {
  if (!confirm('確定清空這天的行程？')) return;
  window.__remove(window.__ref(window.__db, `itinerary/${TRIP_DAYS[currentDay].date}`));
});

document.getElementById('day-region-trigger').addEventListener('click', () => {
  const menu = document.getElementById('day-region-menu');
  menu.classList.toggle('open');
  document.getElementById('day-region-trigger').setAttribute('aria-expanded', String(menu.classList.contains('open')));
});

document.getElementById('day-region-menu').addEventListener('click', event => {
  const button = event.target.closest('[data-region]');
  if (!button) return;
  const date = TRIP_DAYS[currentDay].date;
  const current = getDayRegions(date);
  const value = button.dataset.region;
  const next = current.includes(value) ? current.filter(region => region !== value) : [...current, value];
  dayRegionMap[date] = next;
  if (window.__db) window.__set(window.__ref(window.__db, `day_regions/${date}`), next.length ? next : null);
  buildTabs();
  buildDayRegionSelect();
});

document.getElementById('btn-open-picker').addEventListener('click', () => {
  selectedPlaceIds.clear();
  pickerRegion = '全部';
  document.getElementById('picker-search').value = '';
  document.getElementById('picker-start').value = '';
  renderPickerFilters();
  renderPlacePicker();
  document.getElementById('picker-overlay').classList.add('open');
});
document.getElementById('picker-search').addEventListener('input', renderPlacePicker);
document.getElementById('picker-filters').addEventListener('click', event => {
  const button = event.target.closest('[data-picker-region]');
  if (!button) return;
  pickerRegion = button.dataset.pickerRegion;
  renderPickerFilters();
  renderPlacePicker();
});
document.getElementById('picker-list').addEventListener('click', event => {
  const button = event.target.closest('[data-place-id]');
  if (!button) return;
  const id = button.dataset.placeId;
  selectedPlaceIds.has(id) ? selectedPlaceIds.delete(id) : selectedPlaceIds.add(id);
  renderPlacePicker();
});
document.getElementById('btn-add-selected').addEventListener('click', addSelectedPlaces);
document.getElementById('m-type').addEventListener('change', toggleFlightFields);
document.querySelectorAll('[data-close-modal]').forEach(button => button.addEventListener('click', () => document.getElementById(button.dataset.closeModal).classList.remove('open')));
document.getElementById('picker-overlay').addEventListener('click', event => { if (event.target.id === 'picker-overlay') event.target.classList.remove('open'); });

const TOUR_STEPS = [
  { target:'#date-tabs', title:'選擇旅遊日期', body:'先切換要安排的日期，每一天都會保存自己的城市、景點、通勤、餐廳與航班。' },
  { target:'#day-region-trigger', title:'設定今日城市', body:'同一天可以選擇多個城市，景點選擇器會依這些城市縮小範圍。跨城移動或航班可選「移動日」。' },
  { target:'.action-bar', title:'加入行程項目', body:'可從景點總覽挑選收藏或全部景點，也可手動新增景點、餐廳、住宿、交通與航班。新增時必須填開始與結束時間。' },
  { target:'#btn-add-flight', title:'獨立加入航班', body:'「加入航班」會開啟航班表單，可套用 JX846 或 JX847。航班號、起降機場、飛行時間與報到提醒會一起帶入行程。' },
  { target:'#timeline', title:'行程卡片欄位與圖示', body:'左側時間軸顯示開始與結束時間；卡片標籤顯示類型、航班號與城市；飛機項目會顯示起降機場與飛行時間。備註、地圖、編輯、刪除都在卡片底部。' },
  { target:'#timeline', title:'依時間自動排序', body:'行程會依開始時間自動排列。修改任何項目的時間後，順序會立即重新計算，不需要拖曳。' },
  { target:'#help-btn', title:'隨時重新查看', body:'之後可按右上角問號再次啟動這份互動導覽。' }
];
let tourIndex = 0;
let tourTarget = null;

function closeTour() {
  tourTarget?.classList.remove('tour-target');
  tourTarget = null;
  document.getElementById('help-overlay').classList.remove('open');
  document.getElementById('help-overlay').setAttribute('aria-hidden', 'true');
  document.getElementById('tour-card').classList.remove('open');
  localStorage.setItem('kyushu_itinerary_tour_seen_v4', '1');
}

function placeTourCard() {
  const card = document.getElementById('tour-card');
  if (!tourTarget) {
    card.dataset.placement = 'bottom';
    return;
  }
  const rect = tourTarget.getBoundingClientRect();
  const viewportHeight = window.visualViewport?.height || window.innerHeight;
  const cardHeight = Math.min(viewportHeight * 0.32, 280);
  const bottomNavSpace = 92;
  const spaceAbove = rect.top;
  const spaceBelow = viewportHeight - rect.bottom - bottomNavSpace;
  card.dataset.placement = spaceAbove >= cardHeight && spaceAbove >= spaceBelow ? 'top' : 'bottom';
}

function renderTourStep() {
  tourTarget?.classList.remove('tour-target');
  const step = TOUR_STEPS[tourIndex];
  tourTarget = document.querySelector(step.target);
  if (tourTarget) {
    tourTarget.classList.add('tour-target');
    tourTarget.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
  document.getElementById('tour-progress').textContent = `${tourIndex + 1} / ${TOUR_STEPS.length}`;
  document.getElementById('tour-title').textContent = step.title;
  document.getElementById('tour-body').textContent = step.body;
  document.getElementById('tour-prev').disabled = tourIndex === 0;
  document.getElementById('tour-next').textContent = tourIndex === TOUR_STEPS.length - 1 ? '完成' : '下一步';
  placeTourCard();
  requestAnimationFrame(placeTourCard);
  setTimeout(placeTourCard, 260);
}

function startTour() {
  tourIndex = 0;
  document.getElementById('help-overlay').classList.add('open');
  document.getElementById('help-overlay').setAttribute('aria-hidden', 'false');
  document.getElementById('tour-card').classList.add('open');
  renderTourStep();
}

document.getElementById('help-btn').addEventListener('click', startTour);
document.getElementById('tour-close').addEventListener('click', closeTour);
document.getElementById('tour-prev').addEventListener('click', () => { if (tourIndex > 0) { tourIndex--; renderTourStep(); } });
document.getElementById('tour-next').addEventListener('click', () => {
  if (tourIndex === TOUR_STEPS.length - 1) { closeTour(); return; }
  tourIndex++;
  renderTourStep();
});
if (!requestedFlight && !localStorage.getItem('kyushu_itinerary_tour_seen_v4')) startTour();

document.getElementById('m-name').addEventListener('change', autofillPlaceFields);
document.getElementById('m-name').addEventListener('blur',   autofillPlaceFields);
document.getElementById('m-start').addEventListener('change', setEndByStartAndPlace);

// ── Firebase ──
function waitFirebase(cb) {
  if (window.__firebaseReady) { cb(); return; }
  window.addEventListener('firebase-ready', cb, { once: true });
}

waitFirebase(() => {
  const db = window.__db;

  window.__onValue(window.__ref(db, 'day_regions'), snap => {
    dayRegionMap = snap.val() || {};
    buildTabs(); buildDayRegionSelect();
  });

  window.__onValue(window.__ref(db, 'favs'), snap => {
    const raw = snap.val();
    if (!raw) { favsCache = []; return; }
    if (Array.isArray(raw)) {
      favsCache = raw.flatMap((v, i) => v === true ? [String(i)] : typeof v === 'string' || typeof v === 'number' ? [String(v)] : []).filter(Boolean);
    } else if (typeof raw === 'object') {
      favsCache = Object.entries(raw).flatMap(([k, v]) => {
        if (v === true) return [String(k)];
        if (typeof v === 'string' || typeof v === 'number') return [String(v)];
        if (v && typeof v === 'object') {
          if (v.id !== undefined && v.id !== null) return [String(v.id)];
          if (v.placeId !== undefined && v.placeId !== null) return [String(v.placeId)];
        }
        return [];
      }).filter(Boolean);
    } else {
      favsCache = [];
    }
  });

  window.__onValue(window.__ref(db, 'base_places'), snap => {
    const raw = snap.val() || {};
    allBasePlaces = Object.entries(raw).map(([k, v]) => ({
      ...(v || {}),
      _key: k,
      id: v && v.id !== undefined && v.id !== null && String(v.id).trim() ? v.id : k
    }));
    buildPlaceSuggestions();
  });

  window.__onValue(window.__ref(db, 'custom_places'), snap => {
    const raw = snap.val() || {};
    allCustomPlaces = Object.entries(raw).map(([k, v]) => ({
      ...(v || {}),
      _key: k,
      id: v && v.id !== undefined && v.id !== null && String(v.id).trim() ? v.id : k
    }));
    buildPlaceSuggestions();
  });

  window.__onValue(window.__ref(db, 'itinerary'), snap => {
    const raw = snap.val() || {};
    itineraryData = {};
    Object.entries(raw).forEach(([date, items]) => {
      itineraryData[date] = Object.entries(items).map(([k, v]) => ({ ...v, _key: k }));
    });
    renderDay();
  });

  buildTabs(); buildDayRegionSelect(); renderDay();
});
